  abstract: This article presents a comprehensive study on the simulation of cyber-attacks and potential countermeasures within Urban Traffic Control (UTC) systems. The growing complexity of UTC systems, aimed at improving traffic efficiency, safety, and exploiting connectivity and autonomous capabilities, is leading to increased attack surfaces and vulnerabilities. The potential to exploit these vulnerabilities to adversely affect the system and its users makes them a desirable target, hence the need to increase understanding of the impact coming from security incidents. There is a large volume of research investigating focused attacks and their mitigation in UTC systems; however, there is an absence of understanding of this body of knowledge, identifying challenges and unaddressed areas. To address this gap, this study analyses simulations of attacks against UTC components and connected vehicles, incorporating current mitigation strategies published in recent literature. It discusses the
    implications of these vulnerabilities for public safety and traffic management, proposing future research directions to address the identified challenges. Six prevalent challenges are identified in the field, emphasising the importance of up-to-date simulations for reliable integration into real-time systems. The findings aim to strengthen UTC systems against cyber threats, contributing to the overarching goal of safeguarding lives and optimising urban traffic flow.
  key: de81f73357ef4d0d9dce631937291d45
- type: Conference Papers
  title: Characterizing High-order Interactions between Eye Movement and Head Motion Variables in Augmented Reality-based Navigation Experience
  authors:
  - Qing Xu
  - Shunbo Wang
  - Yunxiang Jiang
  - Simon Parkinson
  - Klaus Schoeffmann
  - Chuntie Chen
  venue: IEEE International Conference on Multimedia & Expo (ICME) 2025
  year: 2025
  month: 10
  publisher: IEEE
  doi: 10.1109/ICME59968.2025.11209820
  url: https://2025.ieeeicme.org/
  abstract: The coordination of eye and head in visual scanning is a fundamental behavior of humans in everyday sensorimotor activities such as walking and navigation. Deep understanding of the spatiotemporal dynamics of this coordination behavior undoubtedly plays an important role for many fields. However, relatively little is known about the computational and high-order interactions between eye and head in visual scanning during sensorimotor tasks. In this paper, based on the utilization of a recent tool from information theory, Partial Information Decomposition PID, we quantify high-order components, namely uniqueness, redundancy, and synergy, in spatiotemporal interactions between eye movement and head motion time-series data during augmented reality-based navigation experience. To our knowledge, this is the first data-driven approach that leverages an information-theoretic tool to characterize high-order interactions involved in eye-head coordination during sensorimotor activities.
  key: 3b1baf2eb6c348608160b9f4d59324d4
- type: Conference Papers
  title: Computational Measures of Gaze Behavior Using the Concept of Situational Awareness
  authors:
  - Yunxiang Jiang
  - Qing Xu
  - Aoxing Xu
  - Simon Parkinson
  - Klaus Schoeffmann
  - Chuntie Chen
  venue: 2025 IEEE International Conference on Multimedia and Expo
  year: 2025
  month: 10
  publisher: IEEE
  doi: 10.1109/ICME59968.2025.11209831
  url: https://2025.ieeeicme.org/
  abstract: Eye gaze is fundamental to common sensorimotor activities. It directly indicates attention and its allocation, making it a critical human factor that reflects cognitive behavior. Data-driven measurements of gaze behavior quantitatively evaluate the allocation of visual attention, indicating the mental and physical activity status of individuals. Situational awareness provides a solid and semantically rich basis for gaze behavior during sensorimotor activities. However, few attempts have been made so far to measure eye gaze data from the perspective of situational awareness. In this paper, we propose four new computational measures of gaze behavior that align with the fundamental concept of situational awareness, effectively measuring the efficiency of visual scanning and sensorimotor activity. Our results have clearly shown that the proposed measures are effective and perform satisfactorily compared to the closely related methods. This work offers a new data-driven approach for
    biomarker discovery and behavioral biometrics using eye gaze data.
  key: b98bd778d2bd4eb6976aad361ca578af
- type: Journal Articles
  title: Unified Digital Twin Approach for Energy Grid Condition and Cybersecurity Monitoring
  authors:
  - Josh Murray
  - Chiheng Huang
  - Simon Parkinson
  - Regan Bolton
  - Duke Gledhill
  - Howard Parkinson
  - Dan Basher
  - Vanessa Vulovic
  - Wenxian Yang
  - Andrew Ball
  venue: IEEE Access
  year: 2025
  month: 10
  volume: '13'
  pages: 180710–180724
  publisher: Institute of Electrical and Electronics Engineers Inc.
  doi: 10.1109/ACCESS.2025.3622468
  abstract: 'As renewable energy technologies continue to advance, there are two primary threats to renewable energy assets: physical system failures and cybersecurity threats. Although the monitoring of physical system failures through condition monitoring is well-established, cyberattacks continue to evolve and create new avenues for physical system failures. As the objective of an attacker is to have an impact on the physical performance of operational technologies, improving cybersecurity is closely coupled with monitoring the physical condition of devices and should not be handled in isolation. This paper presents the development of a digital twin system for monitoring and managing renewable energy infrastructure. The proposed system integrates condition monitoring and cybersecurity, providing a comprehensive framework to ensure the reliability, efficiency, and security of renewable energy resources. By allowing analysts to detect and respond to both physical faults and cyberattacks
    in a timely manner, the system improves the resilience of renewable energy assets. A case study demonstrates the effectiveness of the system in raising alerts for both condition and cybersecurity monitoring, highlighting its potential for broader application across various operational technologies.'
  key: 5e48d69a9d774efbb10968bdfed3536c
- type: Journal Articles
  title: A Review on Multi-step Attack Detection
  authors:
  - Syed Usman Shaukat
  - Saad Khan
  - Simon Parkinson
  venue: IEEE Access
  year: 2025
  month: 9
  volume: '13'
  pages: 161779–161805
  publisher: Institute of Electrical and Electronics Engineers Inc.
  doi: 10.1109/ACCESS.2025.3607497
  abstract: Multi-step Attacks (MSAs) pose a significant cybersecurity threat, aiming at valuable assets and essential infrastructure across diverse sectors. This study offers an in-depth investigation of methodologies for multi-step attack detection, prevention, and automation (DPA). It looks at terms such as ‘multi-stage’ and ‘composite’ attacks, highlighting shared characteristics, including their complexity, persistence, and evasion tactics. The document highlights the significant obstacles contemporary detection systems encounter, especially in managing high-dimensional data, comprehending the sequential characteristics of attacks, and sustaining real-time detection efficacy. The research employs comprehensive visualizations and statistics to demonstrate industry-specific behaviors associated with these challenges. The study assesses the pros and cons of machine/deep learning and graph-based approaches using performance metrics, execution time, and cross-dataset analyses. This review
    significantly identifies prevalent concerns across multiple research studies and their respective frequencies. This underscores the necessity for more dependable, robust, and scalable approaches capable of adapting to the expanding threat landscape, including zero-day vulnerabilities. This review offers scholars and practitioners novel insights into formulating multi-layered threat identification and response tactics to enhance cybersecurity frameworks. Furthermore, it examines how different methodologies used for threat detection, such as machine learning (ML), graph-based techniques, and large language models (LLMs), address particular challenges such as elevated false positives (FPs), dynamic threat patterns, and high-dimensional data processing, while emphasizing the limitations of existing solutions.
  key: 845e1796d1dd418484210cb5f889ad7d
- type: Journal Articles
  title: A contextual framework to standardise the communication of machine learning cyber security characteristics
  authors:
  - Omar Alshaikh
  - Simon Parkinson
  - Saad Khan
  venue: Computer Standards and Interfaces
  year: 2025
  month: 8
  volume: '94'
  publisher: Elsevier BV
  doi: 10.1016/j.csi.2025.104015
  abstract: The widespread integration of machine learning (ML) across diverse application domains has substantially impacted business and personnel. Notably, ML applications in cybersecurity have gained increased prominence, reflecting a discernible trend towards adoption. However, the decisions surrounding ML adoption are susceptible to external influences, potentially resulting in misinterpreting ML capabilities. The communication used when for incorporating ML into cybersecurity applications lacks standardisation and is influenced by various factors such as personal experience, organisational reputation, and marketing strategies. Furthermore, the application of metrics to assess model performance is characterised by dependence, disarray, and subjectivity, introducing probabilities, uncertainties, and the potential for misinterpretation. The different metrics allow for variability in how capability is communicated, often dependent on the restrictive use case, leading to a lack of certainty
    in their interpretation. Previous research has highlighted the need for a standardised approach. Building upon our earlier work, this paper aims to authenticate beneficiaries' perception of Machine Learning Cybersecurity (MLCS) capabilities, before consulting with domain experts through a focus group to elucidate a prototype standard for comprehending MLCS capabilities, offering a pivotal roadmap and an initial framework for a comprehensive understanding and effective communication of MLCS capabilities in practical implementations.
  key: 9a9a47282f8c4ab18476725d2cc7960c
- type: Journal Articles
  title: 'Large Models for Machine Monitoring and Fault Diagnostics: Opportunities, Challenges and Future Direction'
  authors:
  - Xuefeng Chen
  - Yaguo Lei
  - Yanfu Li
  - Simon Parkinson
  - Xiang Li
  - Jinxin Liu
  - Fan Lu
  - Huan Wang
  - Zisheng Wang
  - Bin Yang
  - Shilong Ye
  - Zhibin Zhao
  venue: Journal of Dynamics, Monitoring and Diagnostics
  year: 2025
  month: 6
  volume: '4'
  number: '2'
  pages: 76–90
  publisher: Intelligence Science and Technology Press Inc.
  doi: 10.37965/jdmd.2025.832
  abstract: As a critical technology for industrial system reliability and safety, machine monitoring and fault diagnostics have advanced transformatively with large language models (LLMs). This paper reviews LLM-based monitoring and diagnostics methodologies, categorizing them into in-context learning, fine-tuning, retrieval-augmented generation, multimodal learning, and time series approaches, analyzing advances in diagnostics and decision support. It identifies bottlenecks like limited industrial data and edge deployment issues, proposing a three-stage roadmap to highlight LLMs’ potential in shaping adaptive, interpretable PHM frameworks.
  key: d8e3bfae2c3e4d0b95999a2a793d625a
