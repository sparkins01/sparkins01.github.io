  - Saad Khan
  - Simon Parkinson
  venue: arXiv preprint arXiv:2502.00677
  url: https://arxiv.org/abs/2502.00677
  year: 2025
  month: 2
- type: Journal Articles
  title: 'Offender Characterization and Prediction: A Case Study of The Kingdom of Bahrain'
  authors:
  - Ebrahim J. Alasfoor
  - Omar Alshaikh
  - Isa Inuwa-Dutse
  - Saad Khan
  - Simon Parkinson
  venue: IEEE Access
  year: 2025
  month: 2
  volume: '13'
  pages: 29406–29431
  publisher: Institute of Electrical and Electronics Engineers Inc.
  doi: 10.1109/ACCESS.2025.3531655
  abstract: Crime analysis using data mining techniques can uncover valuable information to assist law enforcement investigations. This study analyses a crime data set from the Kingdom of Bahrain to demonstrate an integrated framework using exploratory analysis and machine learning for predictive modelling. The study data set, comprising 720 cases, was first explored to reveal patterns, including prevalent theft and assault crimes concentrated in four areas. Data sensitivity measures were implemented by anonymising specific geographic areas, represented by characters A to T. Supervised learning algorithms such as Additive Regression, Random Forest, Naïve Bayes, and Decision Tree are then applied to predict unknown offender characteristics such as age, sex, and occupation. The algorithms achieve strong predictive performance. Additive regression achieved a high correlation coefficient of 0.889 for the prediction of the age of the offender, and Random Forest achieved 83% precision in predicting
    sex through 10-fold cross-validation. However, challenges arise with unbalanced nationality data. A survey of 22 police officers was conducted, discussing the study results and the feasibility of the predictive modelling approach to enhance investigative efficiency. The responses received were mostly positive, reflecting a strong endorsement of the potential of the proposed method to enhance law enforcement practices. This research highlights a promising methodology that combines exploratory and machine learning techniques to extract actionable insights from crime data. With appropriate caution, it can improve investigative efficiency by making data-driven predictions of the attributes of the offender. Further work should expand data sets and explore advanced algorithms while addressing ethical concerns regarding predictive modelling in criminal justice.
  key: 9c44f411efc24b0cbe69c60b40973742
- type: Journal Articles
  title: Channel state information based physical layer authentication for Wi‐Fi sensing systems using deep learning in Internet of things networks
  authors:
  - Monika Roopak
  - Yachao Ran
  - Xiaotian Chen
  - Gui Yun Tian
  - Simon Parkinson
  venue: IET Wireless Sensor Systems
  year: 2024
  month: 12
  volume: '14'
  number: '6'
  pages: 441–450
  publisher: John Wiley & Sons Inc.
  doi: 10.1049/wss2.12093
  abstract: Security problems loom big in the fast-growing world of Internet of Things (IoT) networks, which is characterised by unprecedented interconnectedness and data-driven innovation, due to the inherent susceptibility of wireless infrastructure. One of the most pressing concerns is user authentication, which was originally intended to prevent unwanted access to critical information but has since expanded to provide tailored service customisation. We suggest a Wi-Fi sensing-based physical layer authentication method for IoT networks to solve this problem. Our proposed method makes use of raw channel state information (CSI) data from Wi-Fi signals to create a hybrid deep-learning model that combines convolutional neural networks and long short-term memory networks. Rigorous testing yields an astonishing 99.97% accuracy rate, demonstrating the effectiveness of our CSI-based verification. This technology not only strengthens wireless network security but also prioritises efficiency and
    portability. The findings highlight the practicality of our proposed CSI-based physical layer authentication, which provides lightweight and precise protection for wireless networks in the IoT.
  key: 4fd32f0b4cbe4ddc90633677d840f968
- type: Journal Articles
  title: Using computational systematic social observation to identify environmental correlates of fear of crime
  authors:
  - Reka Solymosi
  - Simon Parkinson
  - Andrea Podor
  - Saad Khan
  - Muhammad Khan
  venue: Crime Science
  year: 2024
  month: 12
  volume: '13'
  number: '1'
  publisher: Springer Verlag
  doi: 10.1186/s40163-024-00242-6
  abstract: There is great importance in understanding whether people perceive an environment as safe or unsafe. Perceptions are influenced by the built environment, and through better understanding, design interventions can be made to improve the feeling of safety. There is a rich body of research on this topic, yet it requires a lot of manual effort. In this work, we present an approach named Computational Systematic Social Observation (CSSO) to automate the collection and analysis process. The approach uses Google Street View and the Google Vision API to extract characteristics (herein referred to as features) of the built environment that is used to automate the process of understanding whether people will feel fear or safety. In testing this approach, we extracted ~1.3M images for the 100 locations and identified 297 features of the built environment. A measure of dependency demonstrated that some are more strongly associated with areas where people express a feeling of safety or fear.
    Further, through empirical testing, it is observed that these features can be used for classification. The results demonstrate the potential of the technique and were compared with human coders. The presented methodology and exploratory research provide a foundation for systematic computational observation to identify environmental correlates of fear of crime.
  key: ec6610104a2f45379298c69afe01340c
- type: Journal Articles
  title: A Novel Image Casting and Fusion for Identifying Individuals at Risk of Alzheimer’s Disease Using MRI and PET Imaging
  authors:
  - Adediji A. Fakoya
  - Simon Parkinson
  venue: IEEE Access
  year: 2024
  month: 9
  volume: '12'
  pages: 134101–134114
  publisher: Institute of Electrical and Electronics Engineers Inc.
  doi: 10.1109/ACCESS.2024.3412850
  abstract: 'Alzheimer’s disease (AD) is a neurodegenerative condition characterised by permanent cognitive decline. The financial burden associated with providing care for those affected by this ailment has escalated to a significant magnitude, amounting to billions of dollars. Moreover, projections indicate that the prevalence of this sickness is anticipated to surge by more than 200% throughout the next 15-year period. Numerous researchers have dedicated their efforts to the field of computer-aided diagnosis (CAD), whereby computational methods are used to discern and diagnose various medical conditions. Nevertheless, the identification of persons afflicted with the condition does not mitigate the adverse consequences. It would be advantageous to identify individuals who may be susceptible to the onset of AD at an early stage. This might enhance the efficacy of pharmaceutical interventions and the implementation of preventive measures for AD. The challenge is to determine the best method
    for predicting the conversion from mild cognitive impairment (MCI) to AD while accounting for two factors: (a) how to represent the three-dimensional (3D) magnetic resonance imaging (MRI) and positron emission tomography (PET) images, since processing these images takes a long time, a lot of computational power, and the accuracy may not be very good; and (b) how best to combine the images while maintaining their individual image information. To solve the problem, this research examined two imaging modalities, namely MRI and PET, and convolutional neural networks (CNNs). The modalities were used to investigate the creation of a method for selecting slices from 3D scans for eventual conversion into 2D images and to combine the imagery obtained from the slice selection of the modalities into one used in the CNNs. The purpose of developing the integration was to tackle the issue of insufficient data and retain the information from the two modalities while improving the accuracy in performance
    simultaneously. The image classification process demonstrated a much quicker performance, completing the test in just 0.285% of the time needed by a 3D-CNN for the identical task and achieving an accuracy of 94.0%.'
  key: 17e6526d39cf41c495680974c44bc92b
- type: Journal Articles
  title: An unsupervised approach for the detection of zero‐day distributed denial of service attacks in Internet of Things networks
  authors:
  - Monika Roopak
  - Simon Parkinson
  - Gui Yun Tian
  - Yachao Ran
  - Saad Khan
  - Balasubramaniyan Chandrasekaran
  venue: IET Networks
  year: 2024
  month: 9
  volume: '13'
  number: 5-6
  pages: 513–527
  publisher: John Wiley & Sons Inc.
  doi: 10.1049/ntw2.12134
  abstract: The authors introduce an unsupervised Intrusion Detection System designed to detect zero-day distributed denial of service (DDoS) attacks in Internet of Things (IoT) networks. This system can identify anomalies without needing prior knowledge or training on attack information. Zero-day attacks exploit previously unknown vulnerabilities, making them hard to detect with traditional deep learning and machine learning systems that require pre-labelled data. Labelling data is also a time-consuming task for security experts. Therefore, unsupervised methods are necessary to detect these new threats. The authors focus on DDoS attacks, which have recently caused significant financial and service disruptions for many organisations. As IoT networks grow, these attacks become more sophisticated and harmful. The proposed approach detects zero-day DDoS attacks by using random projection to reduce data dimensionality and an ensemble model combining K-means, Gaussian mixture model, and one-class
    SVM with a hard voting technique for classification. The method was evaluated using the CIC-DDoS2019 dataset and achieved an accuracy of 94.55%, outperforming other state-of-the-art unsupervised learning methods.
  key: 368449f717924ca2b0037005617d9670
- type: Journal Articles
  title: The Emerging Challenges of Wearable Biometric Cryptosystems
  authors:
  - Khalid Alajlan
  - Tariq Alsboui
  - Omar Alshaikh
  - Isa Inuwa-Dutse
  - Saad Khan
  - Simon Parkinson
  venue: Cryptography
  year: 2024
  month: 9
  volume: '8'
  number: '3'
  publisher: Multidisciplinary Digital Publishing Institute (MDPI)
  doi: 10.3390/cryptography8030027
  abstract: Cryptographic key generation and data encryption and decryption using wearable biometric technologies is an emerging research area with significant potential for authentication and communication security. The research area is rapidly developing, and a comprehensive review of recently published literature is necessary to establish emerging challenges. This research article aims to critically investigate and synthesize current research using biometric cryptosystems that use behavior or medico-chemical characteristics, ranging from gate analysis to gaze tracking. The study will summarize the state of knowledge, identify critical research gaps, and provide insight into promising future implications and applications that can enable the realization of user-specific and resilient solutions for authentication and secure communication demands.
  key: 5cb227f318654ecfb3d8f05972e84f00
- type: Technical Reports
  title: Recommendations on Bilateral Government-Private Sector Sharing of Threat Intelligence
  authors:
  - Simon Parkinson
  - Sam Bromage
  - Nastassja Allin
  - Daniel Card
  - Daniel Cuthbert
  - Surinder Lall
  - Thomas Harvey
  - Jeff Moss
  - Prashant Pillai
  year: 2024
  month: 7
  abstract: This paper explores the benefits and barriers towards the bilateral sharing of threat intelligence (TI) between the Government and private sector. The paper presents a two-stage study, comprising a literature review and insights from a workshop at a Government Cyber Security Advisory Board (GCAB) meeting, including experts from government, industry, and academia. The paper highlights the importance of TI for proactive defence against cyber threats and identifies barriers such as trust issues, legal concerns, and the complexity of sharing sensitive information. The findings from both stages are combined to arrive at 7 key recommendations. These recommendations aim to enhance collective cybersecurity by overcoming existing barriers and promoting effective bilateral TI-sharing practices between the Government and private sector.
  key: bba0fc8a965c4c90afd424af37e3141d
- type: Journal Articles
  title: 'Cybersecurity Education and Awareness among Parents and Teachers: A Survey of Bahrain'
  authors:
  - Mohamed Ayyash
  - Tariq Alsboui
  - Omar Alshaikh
  - Isa Inuwa-Dutse
  - Saad Khan
  - Simon Parkinson
  venue: IEEE Access
  year: 2024
  month: 6
  volume: '12'
  pages: 86596–86617
  publisher: Institute of Electrical and Electronics Engineers Inc.
  doi: 10.1109/ACCESS.2024.3416045
  abstract: In today's interconnected and digital world, the need to safeguard sensitive and personal information is vital. The rise in cybercrime, especially that involving minors and vulnerable groups, is alarming. Creating awareness of online risks and safe online behaviour is critical. The purpose of this study is to explore the importance of integrating cybersecurity education in schools, with a focus on practices within Bahrain. We explore prevention measures through user studies (n=251) with parents and teachers. The survey was designed and conducted that included 19 questions for parents (n=157) and 10 for teachers (n=94). The findings revealed that children are highly vulnerable and exposed to various risks, with inadequate awareness of cybersecurity among parents and inadequate parental supervision. Parents and teachers have identified that some of the most common risks children face online are exposure to inappropriate content, such as pornography and interactions with strangers,
    as well as financial fraud. Three out of four parents are aware of the risks, yet only half apply parental controls to protect their children. Parents and teachers (69% parents, 64% teachers) strongly believe that educational institutions have the responsibility to improve cybersecurity awareness among children, and 87% of the participants reported that it is a key priority. However, awareness and distribution of information to students has been established as a key challenge and many believe that the most effective teaching mechanism is reported to be narrative-based, problem solving and video-based. Therefore, it is imperative to adopt proactive measures to improve the cybersecurity education process in Bahrain.
  key: e22ebec89de5410cb38bfb781649830c
- type: Books
  title: 'Deception in Autonomous Transport Systems: Threats, Impacts and Mitigation Policies'
  editors:
  - Simon Parkinson
  - Alexandros Nikitas
  - Mauro Vallati
  venue: Wireless Networks
  year: 2024
  month: 5
  publisher: Springer, Cham
  doi: 10.1007/978-3-031-55044-7
  abstract: This book provides a comprehensive overview of deception in autonomous transport systems. This involves investigating the threats facing autonomous transport systems and how they can contribute towards a deceptive attack, followed by their potential impact if successful, and finally, how they can be mitigated. The work in this book is grouped into three parts. This first part focuses on the area of smart cities, policies, and ethics. This includes critically appraising the trade-off between functionality and security with connected and autonomous vehicles. The second discusses a range of AI applications in the wider field of smart transport and mobility, such as detecting anomalies in vehicle behaviour to investigating detecting disobedient vehicles. Finally, the third part presents and discusses cybersecurity-related aspects to consider when dealing with Connected and Autonomous Vehicles (CAVs) and smart urban infrastructure. This includes analysing different attacks to investigating
    secure communication technologies. CAVs are a game-changing technology with the potential to transform the way transport is perceived, mobility is serviced, travel ecosystems ‘behave’, and cities and societies as a whole function. There are many foreseen safety, accessibility and sustainability benefits resulting from the adoption of CAVs because of their ability, in theory, to operate error-free and collaboratively, ranging from accident prevention, congestion reduction and decreased carbon emissions to time savings, increased social inclusion, optimised routing, and better traffic control. However, no matter what the expected benefits are, CAVs are at the same time susceptible to an unprecedented number of new digital and physical threats. The severity of these threats has resulted in an increased effort to deepen our understanding of CAVs when it comes to their safety and resilience. In this complex and multi-faceted scenario, this book aims to provide an extensive overview of the
    risks related to the malicious exploitation of CAVs and beyond, the potential ways in which vulnerabilities can be exploited, prevention and mitigation policies and techniques, and the impact that the non-acceptance of Connected and Autonomous Mobility can have on the Smart City agenda. This book targets researchers, practitioners, and advanced-level students in computer science and transport engineering.
  key: 328df48de8524cd3a93de52fa33f5728
- type: Book Chapters
  title: 'Detecting Abnormal Vehicle Behavior: A Clustering-Based Approach'
  authors:
  - Shrey Verma
  - Simon Parkinson
  - Saad Khan
  editors:
  - Simon Parkinson
  - Alexandros Nikitas
  - Mauro Vallati
  venue: Deception in Autonomous Transport Systems
  year: 2024
  month: 5
  pages: 99–110
  publisher: Springer, Cham
  doi: 10.1007/978-3-031-55044-7_7
  abstract: 'The increase in connected and autonomous functionality is increasing the potential for cyberattacks. However, the amount of data generated, processed, and stored by the modern vehicle is increasing, and this is creating the potential to detect and prevent abnormal and potentially dangerous situations from occurring. The purpose of this paper is to investigate the area of intrusion detection using automotive data and to lay the foundations of research in intrusion detection using unsupervised machine learning. As vehicles continue to become more connected, there is an increased possibility of them being exploited through a successful cyberattack. An example of a hacked Jeep Cherokee (Amruthnath and Gupta, A research study on unsupervised machine learning algorithms for early fault detection in predictive maintenance. In: 2018 5th International Conference on Industrial Engineering and Applications (ICIEA). IEEE, pp 355–361, 2018) and a remote exploitation strategy using multiple
    attack vectors (Checkoway et al., Comprehensive experimental analyses of automotive attack surfaces. In: USENIX security symposium, vol 4, no. 447–462, p 2021, 2011) demonstrated that vehicles can be remotely compromised. These examples demonstrate the potential to exploit aspects of the vehicle’s communication and control systems, resulting in unexpected behavior. There is therefore a strong need to detect unusual behavior. This paper is focused on detecting attacks targeting a vehicle by identifying abnormal vehicle behavior, exhibited through vehicle control data. To achieve this, synthetic vehicle data containing detectable abnormalities is generated and used for analysis and detection to help detect cyberattacks. Unsupervised machine learning techniques are used to detect abnormal entries in-vehicle data. The synthetic data is generated based on datasets comparable with those generated during normal vehicle operations, before being used to manually insert skewness to generate abnormalities,
    before using and evaluating various unsupervised learning algorithms.'
  key: 0360daedaa054fb78d14f4fec6188cde
- type: Book Chapters
  title: Introduction
  authors:
  - Alexandros Nikitas
  - Simon Parkinson
  - Mauro Vallati
  editors:
  - Simon Parkinson
  - Alexandros Nikitas
  - Mauro Vallati
  venue: Deception in Autonomous Transport Systems
  year: 2024
  month: 5
  pages: 1–3
  publisher: Springer, Cham
  doi: 10.1007/978-3-031-55044-7_1
  abstract: Over half of the world’s 7.7 billion population now reside in urban environments and require good transport options so that they can reach those destinations, people and resources they need for enjoying an adequate standard of living and productivity. Efficient, safe, inclusive and sustainable mobility services and infrastructure have emerged therefore as a prerequisite (and possibly a benchmark) for city prosperity and societal well-being. Reaching this goal, however, is not easy. In the United Kingdom alone, 32.5 million vehicles are resulting in increasing congestion, with the average citizen losing 115 h to road traffic every year at a cost of £8 billion to the economy. In an era where artificial intelligence (AI) is revolutionizing technology and reshaping the world, smart traffic investments and intelligent transport systems (ITS) can be critical for reducing road traffic congestion and all its adverse impacts (i.e. environmental degradation, noise pollution, traffic accidents,
    unhealthy lifestyles, productivity losses).
  key: 28bec963580149dfa34f38d6ef5d8841
- type: Journal Articles
  title: Keyhole Porosity Identification and Localization via X-Ray Imaging With YOLO
  authors:
  - Muhammad Ayub Ansari
  - Andrew Crampton
  - Simon Parkinson
  venue: IEEE Access
  year: 2024
  month: 5
  volume: '12'
  pages: 61049–61061
  publisher: Institute of Electrical and Electronics Engineers Inc.
  doi: 10.1109/ACCESS.2024.3393128
  abstract: The advent of Additive manufacturing (AM) of 3D printed objects is revolutionising the manufacturing industry. Despite its promise, the extensive post-processing requirements of 3D objects remains a significant barrier to AM’s wider adoption. Identifying defects in real-time from powder bed images taken before and after the laser melting of the current layer presents a promising strategy to reduce post-processing efforts. Traditional methods focusing on the top-layer images fall short in identifying multi-layer defects such as keyhole porosity, balling, and lack of fusion, which are critical to the integrity of 3D printed objects. Addressing this challenge, our study introduces an innovative multi-layer technique for the detection of keyhole porosity using high-quality X-ray Computed Tomography (XCT) images, leveraging the capabilities of the cutting-edge YOLO (You Only Look Once) object detection algorithm. Our findings reveal that this approach achieves a remarkable mean average
    precision (mAP) score of 92.585%, underscoring the efficacy of deep learning models in accurately identifying keyhole porosity across XCT images. This research not only demonstrates the potential for improving the quality and reliability of AM processes but also paves the way for reducing the dependency on labour-intensive post-processing steps.
  key: 156dd538d712496bae2db6035c5889c4
- type: Book Chapters
  title: 'The Connected and Autonomous Vehicle Trade-Off: Functional Benefits versus Security Risks'
  authors:
  - Na Liu
  - Alexandros Nikitas
  - Simon Parkinson
  editors:
  - Simon Parkinson
  - Alexandros Nikitas
  - Mauro Vallati
  venue: Deception in Autonomous Transport Systems
  year: 2024
  month: 5
  pages: 43–64
  publisher: Springer, Cham
  doi: 10.1007/978-3-031-55044-7_4
  abstract: Connected and autonomous vehicles (CAVs) are becoming increasingly commonplace. Vehicles are equipped with a range of communication mechanisms, and progress is being made toward automation. These advancements are largely driven by functional benefits that enhance the driver’s experience or quality of service. These advancements are often the priority of vehicle manufacturers. There are many well-known security risks associated with CAV technology, which have resulted in a shift toward a secure-by-design paradigm. However, it is not always possible to mitigate all risks, and there is a need to understand the relationship between functional benefit and risk to determine the most appropriate mitigation technique. In this article, both functional benefits and security risks are discussed, laying the foundation for future research exploring this important intersection.
  key: 79258461a80e4ef78280c47c6e325d90
- type: Book Chapters
  title: The Use of GPS Spoofing Attacks in Location Deception
  authors:
  - Saad Khan
  - Simon Parkinson
  editors:
  - Simon Parkinson
  - Alexandros Nikitas
  - Mauro Vallati
  venue: Deception in Autonomous Transport Systems
  year: 2024
  month: 5
  pages: 181–196
  publisher: Springer, Cham
  doi: 10.1007/978-3-031-55044-7_12
  abstract: Global positioning systems (GPS) play an integral role in location-based systems. These systems are pervasive throughout the use of connected and autonomous vehicles (CAVs), as being able to accurately determine location is essential to provide CAV functionality. This integral use of GPS has created the potential for CAV functionality dependent on knowing the location to be attacked, compromising the vehicle and instigating widespread impacts throughout the traffic infrastructure. The technical means as to how GPS systems can be spoofed are well known; however, less well-known and considered in literature is how GPS spoofing might be targeted to acquire preferential and deceitful behaviours. In this work, the necessary background into GPS workings is provided, before analysing how spoofing could be specifically used to gain preferential behaviour. This article serves as an introduction to this important and significant topic.
  key: 1d8fcc5065a94c99aee0e3b63a198450
- type: Journal Articles
  title: 'Exploring perceptions of decision-makers and specialists in defensive machine learning cybersecurity applications: The need for a standardised approach'
  authors:
  - Omar Alshaikh
  - Simon Parkinson
  - Saad Khan
  venue: Computers and Security
  year: 2024
  month: 4
  volume: '139'
  publisher: Elsevier Limited
  doi: 10.1016/j.cose.2023.103694
  abstract: Machine learning (ML) utilisation has achieved a vast global impact. This is evident in the cybersecurity sector, where ML has wide-ranging applications, such as identifying and blocking threats, uncovering unusual software and user behaviour, and many others. However, the increase in successful cyberattacks demonstrates that the effectiveness of ML in cybersecurity applications can be questioned. Although the attacks may be new, ML is often adopted due to its ability to handle diverse and often unforeseen situations – a capability that is not possible using traditional rule-based security mechanisms. As both the rate of attacks and adoption of ML solutions are increasing, there is a need to determine whether ML-based security solutions are meeting the expectations of businesses and whether businesses are genuinely aware of the ML capabilities and limitations. Moreover, current literature shows a significant variation in how ML solutions are evaluated in cybersecurity applications,
    which might result in a poor understanding of ML capabilities. This paper explores the common perceptions and observations of decision-makers and specialists using ML for cybersecurity regarding its capabilities, implementation, evaluation, and communication. A semi-structured interview is conducted with individuals in various managerial positions to perform this investigation. The finding of this study reveals a pressing need for a standard to manifest ML capabilities. As significant variation in the understanding of Machine Learning Cyber Security (MLCS) capabilities is observed, a standard could help better communicate MLCS capabilities. It is observed that external influences heavily impact ML adoption decisions, potentially leading to misinterpretation of ML capabilities.
  key: 21764a490196422a95b7bf7ba0b91a3e
- type: Journal Articles
  title: 'A Survey on Factors Preventing the Adoption of Automated Software Testing: A Principal Component Analysis Approach'
  authors:
  - George Murazvu
  - Simon Parkinson
  - Saad Khan
  - Na Liu
  - Gary Allen
  venue: Software
  year: 2024
  month: 3
  volume: '3'
  number: '1'
  pages: 1–27
  publisher: MDPI
  doi: 10.3390/software3010001
  abstract: Automated software testing is a crucial yet resource-intensive aspect of software development. This burden on resources affects widespread adoption, with expertise and cost being the primary challenges preventing adoption. This paper focuses on automated testing driven by manually created test cases, acknowledging its advantages while critically analysing its implications across various development stages that are affecting its adoption. Additionally, it analyses the differences in perception between those in nontechnical and technical roles, where nontechnical roles (e.g., management) predominantly strive to reduce costs and delivery time, whereas technical roles are often driven by quality and completeness. This study investigates the difference in attitudes toward automated testing (AtAT), specifically focusing on why it is not adopted. This article presents a survey conducted among software industry professionals that spans various roles to determine common trends and draw
    conclusions. A two-stage approach is presented, comprising a comprehensive descriptive analysis and the use of Principal Component Analysis. In total, 81 participants received a series of 22 questions, and their responses were compared against job role types and experience levels. In summary, six key findings are presented that cover expertise, time, cost, tools and techniques, utilisation, organisation, and capacity.
  key: a98eb760c94b4d52a80e5b1e8228c7d9
- type: Conference Papers
  title: 'One Bus Is All It Takes: The Impact of Cyber Attacks in Customised Bus Services'
  authors:
  - Rongge Guo
  - Alexandros Nikitas
  - Simon Parkinson
  - Mauro Vallati
  venue: Proceedings of 26th IEEE International Conference on Intelligent Transportation Systems
  year: 2024
  month: 2
  pages: 5784–5789
  publisher: IEEE
  doi: 10.1109/ITSC57777.2023.10422703
  url: https://2023.ieee-itsc.org/
  abstract: Connected and Autonomous Vehicle (CAV) technologies have the potential to revolutionise public transport systems, making them more financially and environmentally sustainable, accessible, and user-centric. However, CAV-based bus services are vulnerable to cyber attacks manifesting in unwanted, deceitful behaviour. This includes behaviours such as suppression, overloading, and substitution, which could be used by malicious actors to disrupt service and cause significant damage to both the transport operator and passengers. This paper raises awareness about the potential impact of deceitful behaviour on transport systems by instantiating the ideas in a customised bus system example. More specifically, this work evaluates the impact of a deceitful vehicle in Customised Bus (CB) services, when considering (i) different customer demand profiles, (ii) at what point in planning and control the attack occurs, and (iii) whether the controller has detected the attack. Our empirical analysis
    shows how an attack aimed at compromising a single vehicle can lead to a surge in operating costs of up to 48%. Further, there is an increase in cost, distance travelled, and unserved passengers when the attack goes undetected. The results underscore the importance of preventing and detecting cyber attacks in the deployment of CAV-based solutions and emphasise the need for a proactive approach in managing the associated risks.
  key: dfa73f4a9c2e4886b3fe78b4a4773ba7
- type: Journal Articles
  title: 'The role of Artificial Intelligence in digital forensics: Case studies and future directions'
  authors:
  - Simon Parkinson
  - Saad Khan
  venue: Assessment & Development Matters
  year: 2024
  month: 2
  volume: '16'
  number: '1'
  pages: 42–47
  publisher: British Psychological Society
  doi: 10.53841/bpsadm.2024.16.1.42
  abstract: The increase in digital evidence, especially in cases involving Indecent Images of Children (IIOC), presents a pressing challenge for law enforcement agencies. In this article, we discuss two of the most prominent types of Artificial Intelligence (AI) and how they can be used in digital forensic processes, providing examples, and highlighting potential challenges that are likely to be experienced in developing and adopting AI. The two main types are of Data-Driven Model (DDM) age classification and Model-Based Reasoning (MBR), and in this article, examples for both are provided and discussed in the contents of IIOC investigations.
  key: 2dc87fdf33df4e08943fcca364ec0237
- type: Journal Articles
  title: Information Difference of Transfer Entropies between Head Motion and Eye Movement Indicates a Proxy of Driving
  authors:
  - Runlin Zhang
  - Qing Xu
  - Shunbo Wang
  - Simon Parkinson
  - Klaus Schoeffmann
  venue: Entropy
  year: 2024
  month: 1
  volume: '26'
  number: '1'
  publisher: Multidisciplinary Digital Publishing Institute (MDPI)
  doi: 10.3390/e26010003
  abstract: 'Visual scanning is achieved via head motion and gaze movement for visual information acquisition and cognitive processing, which plays a critical role in undertaking common sensorimotor tasks such as driving. The coordination of the head and eyes is an important human behavior to make a key contribution to goal-directed visual scanning and sensorimotor driving. In this paper, we basically investigate the two most common patterns in eye–head coordination: “head motion earlier than eye movement” and “eye movement earlier than head motion”. We utilize bidirectional transfer entropies between head motion and eye movements to determine the existence of these two eye–head coordination patterns. Furthermore, we propose a unidirectional information difference to assess which pattern predominates in head–eye coordination. Additionally, we have discovered a significant correlation between the normalized unidirectional information difference and driving performance. This result not only
    indicates the influence of eye–head coordination on driving behavior from a computational perspective but also validates the practical significance of our approach utilizing transfer entropy for quantifying eye–head coordination.'
  key: 0bfefdde5ee74d3c9989b4ab1544f5aa
- type: Journal Articles
  title: Towards compliance-based inspection modelling
  authors:
  - Ana Calderon
  - Simon Parkinson
  venue: International Journal of Decision Support Systems
  year: 2024
  month: 1
  volume: '5'
  number: '1'
  pages: 1–13
  publisher: Inderscience
  doi: 10.1504/IJDSS.2024.137226
  abstract: We propose to move towards a risk-profiling approach to determine inspection strategies, with the aim of targeting audit of buildings that have a higher chance of being problematic. Historical data suggests that compliance of responsible persons (those in charge of ensuring fire safety at a particular dwelling) is an important factor in likelihood of danger, but it is presently overlooked in inspection models. With the goal of incorporating compliance in decisions of what and when to inspect, we construct game theoretic models for inspections, encompassing compliance likelihood of responsible persons. The (action-based) game theoretic representations serve to enable the construction of combinatorial optimization algorithms (algorithms for finding the optimal solution to problems where exhaustive searches are an impossibility), capable of deliberative search to identify optimal sequences of inspections. This paper presents a case study on Compliance, some statistical findings,
    then followed by the conceptual game-theoretical modeling.
  key: d3c47d4fd3634c33944ddf2c24439469
- type: Journal Articles
  title: A Survey on the Detection and Impacts of Deepfakes in Visual, Audio, and Textual Formats
  authors:
  - Rami Mubarak
  - Tariq Alsboui
  - Omar Alshaikh
  - Isa Inuwa-Dute
  - Saad Khan
  - Simon Parkinson
  venue: IEEE Access
  year: 2023
  month: 12
  volume: '11'
  pages: 144497–144529
  publisher: Institute of Electrical and Electronics Engineers Inc.
  doi: 10.1109/ACCESS.2023.3344653
  abstract: In the rapidly evolving digital landscape, the generation of fake visual, audio, and textual content poses a significant threat to the trust of society, political stability, and integrity of information. The generation process has been enhanced and simplified using Artificial Intelligence techniques, which have been termed deepfake. Although significant attention has been paid to visual and audio deepfakes, there is also a burgeoning need to consider text-based deepfakes. Due to advancements in natural language processing and large language models, the potential of manipulating textual content to reshape online discourse and misinformation has increased. This study comprehensively examines the multifaceted nature and impacts of deep-fake-generated media. This work explains the broad implications of deepfakes in social, political, economic, and technological domains. State-of-the-art detection methodologies for all types of deepfake are critically reviewed, highlighting the need
    for unified, real-time, adaptable, and generalised solutions. As the challenges posed by deepfakes intensify, this study underscores the importance of a holistic approach that integrates technical solutions with public awareness and legislative action. By providing a comprehensive overview and establishing a framework for future exploration, this study seeks to assist researchers, policymakers, and practitioners navigate the complexities of deepfake phenomena.
  key: db21182d9d6e43a291cca428f6ddec79
- type: Journal Articles
  title: Comparison of deep learning classification models for facial image age estimation in digital forensic investigations
  authors:
  - Monika Roopak
  - Saad Khan
  - Simon Parkinson
  - Rachel Armitage
  venue: 'Forensic Science International: Digital Investigation'
  year: 2023
  month: 12
  volume: '47'
  publisher: Elsevier Ltd
  doi: 10.1016/j.fsidi.2023.301637
  abstract: 'There has been a significant rise in digital forensic investigations containing Indecent Images of Children (IIoC), and one of the major challenges faced by investigators is the time-consuming task of manually investigating images for illicit content. In the UK, law enforcement maintains and uses a standard national repository of IIoC, known as CAID (Child Abuse Image Database), to identify known illegal images by matching their image hashes and metadata. The CAID plays a significant role in making IIoC investigations faster and more effective. However, all images that are not matched through using CAID require manual analysis. Every image has to be viewed and verified as IIoC by investigators. The victim age estimation in the images (i.e., determining whether they are juvenile or adult as this would change the course of the investigation) is a crucial part of this verification process and takes time due to a large number of images to inspect, therefore impacting the speed of
    the investigation, and consequently victims. This is a time-consuming and challenging task for human investigators. Previous work has demonstrated that deep learning has the capability to estimate age with high accuracy in images. This reduces the number of images that will need to be manually processed, thereby finishing the investigation faster. However, in terms of practical implementation in IIoC investigations, there is an absence of a comparative study using the same datasets to establish the most appropriate deep learning model and classification approach to use. This is important as different models have different capabilities and previous works utilise various binary, multi-class, and regression approaches. It is not yet known which is the most accurate for use in digital forensic investigations. In this paper, we construct an extensive dataset before experimenting with four pre-trained deep learning models: VGG16, ResNet50, Xception, and InceptionV3. We have identified that
    binary classification works best for the identification of images as a child or adult, with the ResNet50 obtaining the best results in terms of accuracy (91.70%) on unseen images.'
  key: 52eba9ec2e0f4dabbc247dab82ca8055
- type: Journal Articles
  title: 'Context-based irregular activity detection in event logs for forensic investigations: An itemset mining approach'
  authors:
  - Saad Khan
  - Simon Parkinson
  - Craig Murphy
  venue: Expert Systems with Applications
  year: 2023
  month: 12
  volume: '233'
  publisher: Elsevier Limited
  doi: 10.1016/j.eswa.2023.120991
  abstract: Event logs are a powerful source of digital evidence as they contain detailed information about activities performed on a computer. Forensic investigation of the event logs is a challenging and time-consuming task due to their large volume and continuous generation. A significant amount of time, effort, and knowledge is required to interpret their contents, discovering irregular events that are potentially pertinent to the investigation. As the number of digital investigations increases, so too must resources available to investigators. This requires new techniques to make the process easier and faster, reducing the burden on human investigators as well as being resource efficient. In this paper, a novel solution is presented to examine event logs and automatically identify irregular activities during forensic analysis. The proposed solution utilises a rare itemset mining approach to establish relationships among event entries, based on their contents. Following on, identified
    event relationships are ordered based on their temporal order to represent the timeline or sequence of activity. The solution is also capable of prioritising identified activities by calculating their degree of irregularity. The empirical analysis is performed on 15 live machines, and the results are discussed in terms of accuracy and performance metrics.
  key: dc9a223643c442a285ec950b243eb026
- type: Journal Articles
  title: Classifying Participant Standing and Sitting Postures Using Channel State Information
  authors:
  - Oliver Custance
  - Saad Khan
  - Simon Parkinson
  venue: Electronics
  year: 2023
  month: 11
  volume: '12'
  number: '21'
  publisher: Multidisciplinary Digital Publishing Institute (MDPI)
  doi: 10.3390/electronics12214500
  abstract: Recently, channel state information (CSI) has been identified as beneficial in a wide range of applications, ranging from human activity recognition (HAR) to patient monitoring. However, these focused studies have resulted in data that are limited in scope. In this paper, we investigate the use of CSI data obtained from an ESP32 microcontroller to identify participants from sitting and standing postures in a many-to-one classification. The test is carried out in a controlled isolated environment to establish whether a pre-trained model can distinguish between participants. A total of 15 participants were recruited and asked to sit and stand between the transmitter (Tx) and the receiver (Rx), while their CSI data were recorded. Various pre-processing algorithms and techniques have been incorporated and tested on different classification algorithms, which have gone through parameter selection to enable a consistent testing template. Performance metrics such as the confusion matrix,
    accuracy, and elapsed time were captured. After extensive evaluation and testing of different classification models, it has been established that the hybrid LSTM-1DCNN model has an average accuracy of 84.29% and 74.13% for sitting and standing postures, respectively, in our dataset. The models were compared with the BedroomPi dataset and it was found that LSTM-1DCNN was the best model in terms of performance. It is also the most efficient model with respect to the time elapsed to sit and stand.
  key: 75e4c01c0d3d4399a3f68b5e4fcd4ad4
- type: Conference Papers
  title: Repetition and Template Generalisability for Instance-Based Keystroke Biometric Systems
  authors:
  - Simon Parkinson
  - Saad Khan
  - Paloma Liu
  - Qing Xu
  venue: 2023 IEEE 3rd International Conference on Computer Communication and Artificial Intelligence, CCAI 2023
  year: 2023
  month: 8
  pages: 272–277
  publisher: IEEE
  doi: 10.1109/CCAI57533.2023.10201300
  url: https://www.aconf.org/conf_187029.html
  abstract: Keystroke timings can be used as a behavioural biometric, enabling passive and non-intrusive authentication. Fixed-text keystroke biometric systems involve the acquisition of keypress timings when typing a single phrase. They can be used in conjunction with a standard password authentication system to provide an increased level of security. Design decisions need to be made regarding the different technical aspects (e.g., feature sets, matching mechanism, etc.) of the system and there is a wealth of literature to guide this process. However, there is an absence of knowledge available when it comes to understanding how repetitions in user samples and characteristics of the password provided over an extended timeline can impact the system's accuracy. In this paper, timings are collected from 65 participants, who are required to type the same passwords 4 times per week for 8 weeks, yielding a total of 81,920 timing datasets. A systematic analysis is then performed for each of the
    8 weeks, following the same template creation and matching process, to gain an understanding of which week's timings produce more generalised templates, providing a lower Equal Error Rate when matched against samples from all weeks.
  key: 611e3a2900024e61860940df405a1972
  award: Best Presentation Award, CCAI 2023
- type: Conference Papers
  title: Automated Planning to Prioritise Digital Forensics Investigation Cases Containing Indecent Images of Children
  authors:
  - Saad Khan
  - Simon Parkinson
  - Monika Roopak
  - Rachel Armitage
  - Andrew Barlow
  editors:
  - Sven Koenig
  - Roni Stern
  - Mauro Vallati
  venue: Proceedings of the Thirty-third International Conference on Automated Planning and Scheduling
  year: 2023
  month: 7
  volume: '33'
  number: '1'
  pages: 500–508
  publisher: AAAI press
  doi: 10.1609/icaps.v33i1.27230
  url: https://icaps23.icaps-conference.org/
  abstract: Law enforcement agencies (LEAs) globally are facing high demand to view, process, and analyse digital evidence. Arrests for Indecent Images of Children (IIOC) have risen by a factor of 25 over the previous decade. A case typically requires the use of computing resources for between 2-4 weeks. The lengthy time is due to the sequential ordering of acquiring a forensically sound copy of all data, systematically extracting all images, before finally analysing each to automatically identify instances of known IIOC images (second-generation) or manually identifying new images (first-generation). It is therefore normal practice that an understanding of the image content is only obtained right at the end of the investigative process. A reduction in processing time would have a transformative impact, by enabling timely identification of victims, swift intervention with perpetrators to prevent re-offending, and reducing the traumatic psychological effects of any ongoing investigation for
    the accused and their families. In this paper, a new approach to the digital forensic processes containing suspected IIOC content is presented, whereby in-process metrics are used to prioritise case handling, ensuring cases with a high probability of containing IIOC content are prioritised. The use of automated planning (AP) enables a systematic approach to case priorisation. In this paper, a planning approach is presented where AP is used to generate investigative actions in 60-minute segments, before re-planning to account for discoveries made during the execution of planned actions. A case study is provided consisting of 5 benchmark cases, demonstrating on average a reduction of 36% in processing time and a 26% reduction in time required to discover IIOC content.
  key: b9ef3a2665484d86afd6bd6b32a1445f
- type: Journal Articles
  title: 'A Survey on Empirical Security Analysis of Access Control Systems: A Real-World Perspective'
  authors:
  - Simon Parkinson
  - Saad Khan
  venue: ACM Computing Surveys
  year: 2023
  month: 6
  volume: '55'
  number: '6'
  publisher: Association for Computing Machinery
  doi: 10.1145/3533703
  abstract: There any many different access control systems, yet a commonality is that they provide flexible mechanisms to enforce different access levels. Their importance in organisations to adequately restrict resources, coupled with their use in a dynamic environment, mandates the need to routinely perform policy analysis. The aim of performing analysis is often to identify potential problematic permissions, which have the potential to be exploited and could result in data theft and unintended modification. There is a vast body of published literature on analysing access control systems, yet as performing analysis has a strong end-user motivation and is grounded in security challenges faced in real-world systems, it is important to understand how research is developing, what are the common themes of interest, and to identify key challenges that should be addressed in future work. To the best of the authors’ knowledge, no survey has been performed to gain an understanding of empirical
    access control analysis, focussing on how techniques are evaluated and how they align to the needs of real-world analysis tasks. This article provides a systematic literature review, identifying and summarising key works. Key findings are identified and discussed as areas of future work.
  key: 21077f9d7de44d3ca6fff71514c9be68
- type: Conference Papers
  title: On the Variability in the Application and Measurement of Supervised Machine Learning in Cyber Security
  authors:
  - Omar Alshaikh
  - Simon Parkinson
  - Saad Khan
  editors:
  - Guojun Wang
  - Kim-Kwang Raymond Choo
  - Jie Wu
  - Ernesto Damiani
  venue: Ubiquitous Security
  year: 2023
  month: 2
  volume: 1768 CCIS
  pages: 545–555
  publisher: Springer Singapore
  doi: 10.1007/978-981-99-0272-9_38
  url: http://ubisecurity.org/2022/
  abstract: Supervised learning (SL) is being increasingly adopted to enhance capability and mitigate cyberattacks. Published literature containing empirical studies often demonstrates an optimistic viewpoint, with promising results achieving greater than 90% in terms of accuracy when detecting and mitigating cyberattacks. These results are often generated on well-refined test scenarios. Cyberattack statistics show a continued increase in occurrence and continue to result in significant damage. This is resulting in organisations becoming increasingly worried about suffering a cyberattack, increasing their desire to identify and adopt suitable solutions. The optimistic result presented in research studies might misrepresent the application’s true capabilities and set unreachable expectations. The purpose of this paper is to investigate how SL technique is applied to cybersecurity challenges and how it is evaluated. To pursue this aim, a literature review is undertaken, classifying the most
    common SL performance measurements in cybersecurity research. The key finding of this paper revealed that SL is mostly used because of its capabilities in detecting known patterns on a restrictive application challenge. This could therefore be misleading for those wanting to utilise such systems.
  key: 64836dbbfa5546b9889ac0ff297ed7c6
- type: Journal Articles
  title: 'An empirical analysis of keystroke dynamics in passwords: a longitudinal study'
  authors:
  - Simon Parkinson
  - Saad Khan
  - Alexandru-Mihai Badea
  - Andrew Crampton
  - Paloma Liu
  - Qing Xu
  venue: IET Biometrics
  year: 2023
  month: 1
  volume: '12'
  number: '1'
  pages: 25–37
  publisher: John Wiley and Sons Ltd
  doi: 10.1049/bme2.12087
  abstract: The use of keystroke timings as a behavioural biometric in fixed-text authentication mechanisms has been extensively studied. Previous research has investigated in isolation the effect of password length, character substitution, and participant repetition. These studies have used publicly available datasets, containing a small number of passwords with timings acquired from different experiments. Multiple experiments have also used the participant's first and last name as the password; however, this is not realistic of a password system. Not only is the user's name considered a weak password, but their familiarity with typing the phrase minimises variation in acquired samples as they become more familiar with the new password. Furthermore, no study has considered the combined impact of length, substitution, and repetition using the same participant pool. This is explored in this work, where the authors collected timings for 65 participants, when typing 40 passwords with varying
    characteristics, 4 times per week for 8 weeks. A total of 81,920 timing samples were processed using an instance-based distance and threshold matching approach. Results of this study provide empirical insight into how a password policy should be created to maximise the accuracy of the biometric system when considering substitution type and longitudinal effects.
  key: 873387bfc62048dd936299b02acac90e
- type: Book Chapters
  title: A Case Study of Using Machine Learning Techniques for COVID-19 Diagnosis
  authors:
  - Marco Dinacci
  - Tianhua Chen
  - Mufti Mahmud
  - Simon Parkinson
  editors:
  - Tianhua Chen
  - Jenny Carter
  - Mufti Mahmud
  - Arjab Singh Khuman
  venue: Artificial Intelligence in Healthcare
  year: 2022
  month: 10
  pages: 201–213
  publisher: Springer Singapore
  doi: 10.1007/978-981-19-5272-2_10
  abstract: The Coronavirus disease (COVID-19) is a worldwide pandemic that has lead to millions of death and is affecting every corner of the society. The industrial and scientific communities are continuously working to curb the spread of the pandemic, with efforts in numerous areas including disease detection and diagnosis, virology, vaccine and drug development. As a powerful technique, Artificial Intelligence (AI) and machine learning techniques have been widely incorporated in COVID-19 related research and development. With the aim to establish a use case of machine learning techniques for COVID-19 diagnosis, this paper applies the XGBoost machine learning technique, while examining a number of hyperparameters and data preprocessing techniques, to identify an accurate predictive model, followed by the use of Shapley value to study predictors that are most informative of the diagnosis. Evaluated on a collection of anonymised patients data collected out of the standard Reverse Transcriptase
    Polymerase Chain Reaction (RT-PCR) and additional laboratory test results, the best model obtained demonstrates high diagnostic performance.
  key: e434d9d2ca474522ad9be65f1c0f51f0
- type: Journal Articles
  title: A Layer-Wise Surface Deformation Defect Detection by Convolutional Neural Networks in Laser Powder-Bed Fusion Images
  authors:
  - Muhammad Ayub Ansari
  - Andrew Crampton
  - Simon Parkinson
  venue: Materials
  year: 2022
  month: 10
  volume: '15'
  number: '20'
  publisher: Multidisciplinary Digital Publishing Institute (MDPI)
  doi: 10.3390/ma15207166
  abstract: Surface deformation is a multi-factor, laser powder-bed fusion (LPBF) defect that cannot be avoided entirely using current monitoring systems. Distortion and warping, if left unchecked, can compromise the mechanical and physical properties resulting in a build with an undesired geometry. Increasing dwell time, pre-heating the substrate, and selecting appropriate values for the printing parameters are common ways to combat surface deformation. However, the absence of real-time detection and correction of surface deformation is a crucial LPBF problem. In this work, we propose a novel approach to identifying surface deformation problems from powder-bed images in real time by employing a convolutional neural network-based solution. Identifying surface deformation from powder-bed images is a significant step toward real-time monitoring of LPBF. Thirteen bars, with overhangs, were printed to simulate surface deformation defects naturally. The carefully chosen geometric design overcomes
    problems relating to unlabelled data by providing both normal and defective examples for the model to train. To improve the quality and robustness of the model, we employed several deep learning techniques such as data augmentation and various model evaluation criteria. Our model is 99% accurate in identifying the surface distortion from powder-bed images.
  key: b6c93c91b5a645e0a3cd0cc66bc060f6
- type: Journal Articles
  title: Exudate Regeneration for Automated Exudate Detection in Retinal Fundus Images
  authors:
  - Muhammad Hussain
  - Hussain Al-Aqrabi
  - Muhammad Munawar
  - Richard Hill
  - Simon Parkinson
  venue: IEEE Access
  year: 2022
  month: 9
  publisher: Institute of Electrical and Electronics Engineers Inc.
  doi: 10.1109/ACCESS.2022.3205738
  abstract: This paper presents a framework for the automated detection of Exudates, an early sign of Diabetic Retinopathy. The paper introduces a classification-extraction-superimposition (CES) mechanism for enabling the generation of representative exudate samples based on limited open-source samples. The paper demonstrates how the manipulation of Yolov5M output vector can be utilized for exudate extraction and super-imposition, segueing into the development of a custom CNN architecture focused on exudate classification in retinal based fundus images. The performance of the proposed architecture is compared with various state-of-the-art image classification architectures on a wide range of metrics, including the simulation of post deployment inference statistics. A self-label mechanism is presented, endorsing the high performance of the developed architecture, achieving 100% on the test dataset.
  key: 6d51b50f9a554f80b2003147f7db9be9
- type: Journal Articles
  title: 'The Deceitful Connected and Autonomous Vehicle: Defining the Concept, Contextualising its Dimensions and Proposing Mitigation Policies'
  authors:
  - Alexandros Nikitas
  - Simon Parkinson
  - Mauro Vallati
  venue: Transport Policy
  year: 2022
  month: 6
  volume: '122'
  pages: 1–10
  publisher: Elsevier Limited
  doi: 10.1016/j.tranpol.2022.04.011
  abstract: 'The Connected and Autonomous Vehicle (CAV) is an emerging mobility technology that may hold a paradigm-changing potential for the future of transport policy and planning. Despite a wealth of likely benefits that have made their eventual launch inescapable, CAVs may also be a source of unprecedented disruption for tomorrow’s travel eco-systems because of their vulnerability to cyber-threats, hacking and misinformation. CAVs manipulated by users, traffic controllers or third parties may act in deceitful ways. This scene-setting work introduces the deceitful CAV, a vehicle that operates in a deceitful manner towards routing and control functionality for ‘selfish’ or malicious purposes and contextualises its diverse expressions and dimensions. It specifically offers a systematic taxonomy of eight distinctive deceitful behaviours namely: suppression/camouflage, overloading, mistake, substitution, target conditioning, repackaging capability signatures, amplification and reinforcing
    impression. These as exemplified by their most common attack forms (i.e., starvation, denial-of-service, session hijacking, man-in-the-middle, poisoning, masquerading, flooding and spoofing) are then benchmarked against five key dimensions referring to time frame (short to long duration), engagement (localised to systemic), urban traffic controller infrastructure (single to multiple components), scale (low to high), and impact (low to high). We then suggest mitigation strategies to protect CAV technology against these dangers. These span from purely technological measures referring to the machine-centric triad of vehicles, communication, and control system including adversarial training, heuristic decision algorithms and weighted voting mechanisms to human factor measures that focus on education, training, awareness enhancement, licensing and legislation initiatives that will enable users and controllers to prevent, control or report deceitful activities.'
  key: 9f6cc949586d4fdfaad409126c7ff776
- type: Conference Papers
  title: Transformation of cyber security/safety assurance
  authors:
  - R. J. Thomas
  - George Bearfield
  - Coen van Gulijk
  - Simon Parkinson
  venue: World Congress on Railway Research
  year: 2022
  month: 6
- type: Journal Articles
  title: Identifying high-risk over-entitlement in access control policies using fuzzy logic
  authors:
  - Simon Parkinson
  - Saad Khan
  venue: Cybersecurity
  year: 2022
  month: 3
  volume: '5'
  number: '1'
  publisher: SpringerOpen
  doi: 10.1186/s42400-022-00112-1
  abstract: Analysing access control policies is an essential process for ensuring over-prescribed permissions are identified and removed. This is a time-consuming and knowledge-intensive process, largely because there is a wealth of policy information that needs to be manually examined. Furthermore, there is no standard definition of what constitutes an over-entitled permission within an organisation’s access control policy, making it not possible to develop automated rule-based approaches. It is often the case that over-entitled permissions are subjective to an organisation’s role-based structure, where access is be divided and managed based on different employee needs. In this context, an irregular permission could be one where an employee has frequently changed roles, thus accumulating a wide-ranging set of permissions. There is no one size fits all approach to identifying permissions where an employee is receiving more permission than is necessary, and it is necessary to examine them
    in the context of the organisation to establish their individual risk. Risk is not a binary measure and, in this work, an approach is built using Fuzzy Logic to determine an overall risk rating, which can then be used to make a more informed decision as to whether a user is over-entitled and presenting risk to the organisation. This requires the exploratory use of establishing resource sensitivity and user trust as measures to determine a risk rating. The paper presents a generic solution, which has been implemented to perform experimental analysis on Microsoft’s New Technology File System to show how this works in practice. A simulation using expert knowledge for comparison is then performed to demonstrate how effective it is at helping the user identify potential irregular permissions.
  key: 4036220f51c54b509b048b4ce4e18bf7
- type: Journal Articles
  title: Robust data expansion for optimised modelling using adaptive neuro-fuzzy inference systems
  authors:
  - Samer Mohammed Jaber Mubarak
  - Andrew Crampton
  - Jennifer Carter
  - Simon Parkinson
  venue: Expert Systems with Applications
  year: 2022
  month: 3
  volume: '189'
  publisher: Elsevier Limited
  doi: 10.1016/j.eswa.2021.116138
  abstract: This work focuses on the problem of constructing accurate prediction models using an adaptive neuro-fuzzy inference system (ANFIS) from data that are scarce and poorly scaled. Many real-world problems have limited data to work with and yet require models with high prediction accuracy. Due to the fuzzy nature of many data sets, it is appropriate to construct prediction models using fuzzy inference systems (FIS), rather than traditional artificial neural network (ANN) models. However, the scarcity of the data raises serious concerns when attempting to construct models of this type. In this paper, we address the problem of constructing accurate prediction models using ANFIS in circumstances where capturing large amounts of data is difficult. We propose a new approach, using robust data expansion methods to enhance the data carefully. This approach provides the learning algorithm with enough representative data to allow all of the parameters (premise and consequent) to be optimised.
    We compare and contrast the effectiveness in reducing prediction error for three specific expansion models using radial basis function (RBF) kernels. When expanding data, for which the underlying smoothness properties are not known, there is often a danger of over-smoothing. This is usually noticeable at turning points and can occur when fitting the data using polynomials or cubic splines for example. To avoid over-smoothing, we introduce a modified multiquadric approach that allows smooth, near-interpolation while maintaining the desirable shape-preserving properties of the data. The proposed method is explained through two case studies — the first to predict gasoline consumption for the oil/fuel industry in Iraq and the second for predicting natural gas consumption in Iran. This is the first study that uses adjustable, shape-preserving re-sampling methods for optimising ANFIS models in low data environments.
  key: 7057790fda574a488d88bb85d2de0865
- type: Journal Articles
  title: Analysis of security and privacy challenges for DNA-genomics applications and databases
  authors:
  - Saadia Arshad
  - Junaid Arshad
  - Muhammad Mubashir Khan
  - Simon Parkinson
  venue: Journal of Biomedical Informatics
  year: 2021
  month: 7
  volume: '119'
  publisher: Academic Press Inc.
  doi: 10.1016/j.jbi.2021.103815
  abstract: DNA technology is rapidly moving towards digitization. Scientists use software tools and applications for sequencing, synthesizing, analyzing and sharing of DNA and genomic data, operate lab equipment and store genetic information in shared datastores. Using cutting-edge computing methods and techniques, researchers have decoded human genome, created organisms with new capabilities, automated drug development and transformed food safety. Such software applications are typically developed to progress scientific understanding and as such cyber security is never a concern for these applications. However, with the increasing commercialisation of DNA technologies, coupled with the sensitivity of DNA data, there is a need to adopt a security-by-design approach. In this paper we investigate bio-cyber security threats to genomic-DNA data and software applications making use of such data to advance scientific research. Specifically, we adopt an empirical approach to analyse and identify
    vulnerabilities within genomic-DNA databases and bioinformatics software applications that can lead to cyber-attacks affecting the confidentiality, integrity and availability of such sensitive data. We present a detailed analysis of these threats and highlight potential protection mechanisms to help researchers pursue these research directions.
  key: b67ed1cdfca84953aeba9f94889f5ee9
- type: Conference Papers
  title: A Jensen-Shannon Divergence Driven Metric of Visual Scanning Efficiency Indicated Performance of Virtual Driving
  authors:
  - Zezhong Lv
  - Qing Xu
  - Klaus Schoeffmann
  - Simon Parkinson
  venue: IEEE International Conference on Multimedia and Expo
  year: 2021
  month: 6
  publisher: IEEE Computer Society
  doi: 10.1109/ICME51207.2021.9428109
  url: https://2021.ieeeicme.org/
  abstract: Visual scanning plays an important role in sampling visual information from the surrounding environments for a lot of everyday sensorimotor tasks, such as driving. In this paper, we consider the problem of visual scanning mechanism underpinning sensorimotor tasks in 3D dynamic environments. We exploit the use of eye tracking data as a behaviometric, for indicating the visuo-motor behavioral measure in the context of virtual driving. A new metric of visual scanning efficiency (VSE), which is defined as a mathematical divergence between a fixation distribution and a distribution of optical flows induced by fixations, is proposed by making use of a widely known information theoretic tool, namely the square root of Jensen-Shannon divergence. Psychophysical eye tracking studies, in virtual reality based driving, are conducted to reveal that the new metric of visual scanning efficiency can be employed very well as a proxy evaluation for driving performance. These results suggest that
    the exploitation of eye tracking data provides an effective behaviometric for sensorimotor activities.
  key: a0058e674f4b48e3a11c4bed5ed6ced9
- type: Journal Articles
  title: 'OCEAN: A Non-Conventional Parameter Free Clustering Algorithm Using Relative Densities of Categories'
  authors:
  - Iffat Gheyas
  - Simon Parkinson
  - Saad Khan
  venue: International Journal of Pattern Recognition and Artificial Intelligence
  year: 2021
  month: 4
  volume: '35'
  number: '5'
  publisher: World Scientific Publishing Co. Pte Ltd
  doi: 10.1142/S0218001421500178
  abstract: In this paper, we propose a fully autonomous density-based clustering algorithm named 'Ocean', which is inspired by the oceanic landscape and phenomena that occur in it. Ocean is an improvement over conventional algorithms regarding both distance metric and the clustering mechanism. Ocean defines the distance between two categories as the difference in the relative densities of categories. Unlike existing approaches, Ocean neither assigns the same distance to all pairs of categories, nor assigns arbitrary weights to matches and mismatches between categories that can lead to clustering errors. Ocean uses density ratios of adjacent regions in multidimensional space to detect the edges of the clusters. Ocean is robust against clusters of identical patterns. Unlike conventional approaches, Ocean neither makes any assumption regarding the data distribution within clusters, nor requires tuning of free parameters. Empirical evaluations demonstrate improved performance of Ocean over
    existing approaches.
  key: c0b3f2abdea7449685e9d0056a27d1f1
- type: Journal Articles
  title: Password policy characteristics and keystroke biometric authentication
  authors:
  - Simon Parkinson
  - Saad Khan
  - Andrew Crampton
  - Qing Xu
  - Weizhi Xie
  - Paloma Liu
  - Kyle Dakin
  venue: IET Biometrics
  year: 2021
  month: 3
  volume: '10'
  number: '2'
  pages: 163–178
  publisher: John Wiley and Sons Ltd
  doi: 10.1049/bme2.12017
  abstract: Behavioural biometrics have the potential to provide an additional or alternative authentication mechanism to those involving a shared secret (i.e., a password). Keystroke timings are the focus of this study, where key press and release timings are acquired whilst monitoring a user typing a known phrase. Many studies exist in keystroke biometrics, but there is an absence of literature aiming to understand the relationship between characteristics of password policies and the potential of keystroke biometrics. Furthermore, benchmark data sets used in keystroke biometric research do not enable useful insights into the relationship between their capability and password policy. In this work, we consider substitutions of uppercase, numeric, special characters, and their combination on passwords derived from English words. We acquire timings for 42 participants for the same 40 passwords. We implement a matching system using the Manhattan distance measure with seven different feature
    sets, culminating in an Equal Error Rate of between 6-11% and accuracy values between 89-94%, demonstrating comparable accuracy to other threshold-based systems. Further analysis suggests that the best feature sets are those containing all timings and trigraph press to press. Evidence also suggests that phrases containing fewer characters have greater accuracy, except for those with special character substitutions.
  key: c869ebe2a0a74480bf95208ad1e286e1
- type: Books
  title: Digital Forensic Investigation of Internet of Things (IoT) Devices
  authors:
  - Reza Montasari
  - Hamid Jahankhani
  - Richard Hill
  - Simon Parkinson
  venue: Advanced Sciences and Technologies for Security Applications
  year: 2020
  month: 12
  publisher: Springer Nature Switzerland AG
  doi: 10.1007/978-3-030-60425-7
  abstract: This book provides a valuable reference for digital forensics practitioners and cyber security experts operating in various fields of law enforcement, incident response and commerce. It is also aimed at researchers seeking to obtain a more profound knowledge of Digital Forensics and Cybercrime. Furthermore, the book is an exceptional advanced text for PhD and Master degree programmes in Digital Forensics and Cyber Security. Each chapter of this book is written by an internationally-renowned expert who has extensive experience in law enforcement, industry and academia. The increasing popularity in the use of IoT devices for criminal activities means that there is a maturing discipline and industry around IoT forensics. As technology becomes cheaper and easier to deploy in an increased number of discrete, everyday objects, scope for the automated creation of personalised digital footprints becomes greater. Devices which are presently included within the Internet of Things (IoT)
    umbrella have a massive potential to enable and shape the way that humans interact and achieve objectives. These also forge a trail of data that can be used to triangulate and identify individuals and their actions. As such, interest and developments in autonomous vehicles, unmanned drones and ‘smart’ home appliances are creating unprecedented opportunities for the research communities to investigate the production and evaluation of evidence through the discipline of digital forensics.
  key: 53257d4429434ad1957d1365323589b7
- type: Journal Articles
  title: Low-cost fitness and activity trackers for biometric authentication
  authors:
  - Saad Khan
  - Simon Parkinson
  - Paloma Liu
  - Liam Grant
  venue: Journal of Cybersecurity
  year: 2020
  month: 12
  volume: '6'
  number: '1'
  publisher: Oxford University Press
  doi: 10.1093/cybsec/tyaa021
  abstract: Fitness and activity tracking devices acquire, process, and store rich behavioural data that is consumed by the end-user to learn health insights. This rich data source also enables a secondary use of being part of a biometric authentication system. However, there are many open research challenges with the use of data generated by fitness and activity trackers as a biometric source. In this paper, the challenge of using data acquired from low-cost devices is tackled. This includes investigating how to best partition the data to deduce repeatable behavioural traits while maximising the uniqueness between participant data sets. In this exploratory research, three months' worth of data (heart rate, step count, and sleep) for five participants is acquired and utilised in its raw form from low-cost devices. It is established that dividing the data into 14 hour segments is deemed the most suitable based on measuring coefficients of variance. Several supervised machine learning algorithms
    are then applied where the performance is evaluated by six metrics to demonstrate the potential of employing this data source in biometric-based security systems.
  key: dab4697b596946d992945ab06e89136a
- type: Journal Articles
  title: 'Exploring expert perceptions about the cyber security and privacy of Connected and Autonomous Vehicles: A thematic analysis approach'
  authors:
  - Paloma Liu
  - Alexandros Nikitas
  - Simon Parkinson
  venue: 'Transportation Research Part F: Traffic Psychology and Behaviour'
  year: 2020
  month: 11
  volume: '75'
  pages: 66–86
  publisher: Elsevier Limited
  doi: 10.1016/j.trf.2020.09.019
  abstract: 'Connected and Autonomous Vehicles (CAVs) constitute an automotive development carrying paradigm-shifting potential that may soon be embedded into a dynamically changing urban mobility landscape. The complex machine-led dynamics of CAVs make them more prone to data exploitation and vulnerable to cyber attacks than any of their predecessors increasing the risks of privacy breaches and cyber security violations for their users. This can adversely affect the public acceptability of CAVs, give them a bad reputation at this embryonic stage of their development, create barriers to their adoption and increased use, and complicate the business models of their future operations. Therefore, it is vital to identify and create an in-depth understanding of the cyber security and privacy issues associated with CAVs, and of the way these can be prioritised and addressed. This work employs 36 semi-structured elite interviews to explore the diverse dimensions of user acceptance through the lens
    of the well-informed CAV experts that already anticipate problems and look for their solutions. Our international interviewee sample represents academia, industry and policy-making so that all the key stakeholder voices are heard. Thematic analysis was used to identify and contextualise the factors that reflect and affect CAV acceptance in relation to the privacy and cyber security agendas. Six core themes emerged: awareness, user and vendor education, safety, responsibility, legislation, and trust. Each of these themes has diverse and distinctive dimensions and are discussed as sub-themes. We recommend that mitigating the cyber security and privacy risks embedded in CAVs require inter-institutional cooperation, awareness campaigns and trials for trust-building purposes, mandatory educational training for manufacturers and perhaps more importantly for end-users, balanced and fair responsibility-sharing, two-way dynamic communication channels and a clear consensus on what constitutes
    threats and solutions.'
  key: 9c318917acc44ffda7dd0cdd4ef946f2
- type: Journal Articles
  title: 'Hardware-based cyber threats: attack vectors and defence techniques'
  authors:
  - Reza Montasari
  - Richard Hill
  - Simon Parkinson
  - Alireza Daneshkhah
  - Amin Hosseinian-Far
  venue: International Journal of Electronic Security and Digital Forensics
  year: 2020
  month: 10
  volume: '12'
  number: '4'
  pages: 397–411
  publisher: Inderscience Enterprises Ltd
  doi: 10.1504/IJESDF.2020.110675
  abstract: There are certain vulnerabilities associated with computing hardware that attackers can exploit to launch destructive attacks which often go undetected by the existing hardware and software countermeasures. Side channel attacks (SCAs) and Rowhammer attacks (RHAs), the consequences of hardware vulnerabilities, pose significant security and privacy threats to self-contained computing components and their end-users respectively. Such attacks compromise the security of computational environments, even those with advanced protection mechanisms such as virtualisation, sandboxes or robust encryptions. In light of these security threats against modern computing hardware, we perform an analysis overview of the modi operandi of SCAs and RHAs in hardware implementation and techniques that can be used to extract sensitive data such as secret keys. We then propose various countermeasures to safeguard against these attacks.
  key: 353aef8d625f485a855b36b2c49b487b
- type: Journal Articles
  title: 'Biometric Systems utilising Health Data From Wearable Devices: Applications and Future Challenges in Computer Security'
  authors:
  - Saad Khan
  - Simon Parkinson
  - Liam Grant
  - Paloma Liu
  - Stephen McGuire
  venue: ACM Computing Surveys
  year: 2020
  month: 9
  volume: '53'
  number: '4'
  publisher: Association for Computing Machinery
  doi: 10.1145/3400030
  abstract: Health data are being increasingly sensed from the health-based wearable Internet of Things (IoT) devices, providing much-needed fitness and health tracking. However, data generated also present opportunities within computer security, specifically with biometric systems used for identification and authentication purposes. This article performs a systematic review of health-based IoT data collected from wearable IoT technology. This involved performing research in the underlying data sources, what they are collected for in terms of their health monitoring, and the underlying data characteristics. Furthermore, it explores existing work in computer security using these data sources, identifying key themes of work, key limitations, and challenges. Finally, key opportunities are provided as summaries to the potential of health-based IoT data, highlighting challenges that are yet to be addressed, which motivate areas of future work.
  key: dd8f408bf7df43e79f1b161af4aa5e7a
- type: Journal Articles
  title: 'Built environment attributes and crime: an automated machine learning approach'
  authors:
  - Kyle Dakin
  - Weizhi Xie
  - Simon Parkinson
  - Saad Khan
  - Leanne Monchuk
  - Kenneth Pease
  venue: Crime Science
  year: 2020
  month: 7
  volume: '9'
  number: '1'
  publisher: Springer Verlag
  doi: 10.1186/s40163-020-00122-9
  abstract: This paper presents the development of an automated machine learning approach to gain an understanding of the built environment and its relationship to crime. This involves the automatic capture of street-level photographs using Google Street View (GSV), followed by the use of supervised machine learning techniques (specifically image feature recognition) to recognise features of the built environment. In this exploratory proof-of-concept work, 8 key features (building, door, fence, streetlight, tree, window, hedge, and garage) are considered and a worked case-study is demonstrated for a small geographical area (8,300 square kilometres) in Northern England. A total of 60,100 images were automatically collected and analysed across the area where 5,288 crime incidents were reported over a twelve-month period. Dependency between features and crime incidents are measured; however, no strong correlation has been identified. This is unsurprisingly considering the high number of crime
    incidents in a small geographic region (8,300 square kilometres), resulting in an overlap between specific features and multiple crime incidents. Furthermore, due to the unknown precise location of crime instances, an approximation technique is developed to survey a crime's local proximity. Despite the absence of a strong correlation, this paper presents a first-of-a-kind cross-discipline approach to attempt and use computation techniques to produce new empirical knowledge. There are many avenues of future research in this fertile and important area.
  key: 6c5a3f9ec51a49bcb61a3a52b420f068
- type: Journal Articles
  title: Simultaneous Constant Velocity Measurement of the Motion Errors of Linear Axes
  authors:
  - Jonathan Miller
  - Simon Fletcher
  - Andrew Longstaff
  - Simon Parkinson
  venue: International Journal of Automation Technology
  year: 2020
  month: 5
  volume: '14'
  number: '3'
  pages: 417–428
  publisher: Fuji Technology Press
  doi: 10.20965/ijat.2020.p0417
  abstract: The current standard for machine tool calibration supports the use of quasi-static measurement techniques. When measuring the six degrees of freedom motion errors, the measurements are typically taken consecutively. This introduces uncertainty when comparing the results due to machine deformation during individual measurements. Furthermore, Quasi-static measurement techniques are known to be time consuming, a problem that is exacerbated as each degree of freedom must be measured separately. Additionally, the spatial resolution between the selected target positions can have an impact on calibration quality. In the following paper, the benefits of measuring the six motion errors simultaneously while the axis under test is traversing at a nominally constant velocity is presented. Firstly, the motivation for simultaneous continuous capture is presented. Secondly, continuous motion measurements are compared with quasi-static measurements for the six-degrees-of-freedom motion errors
    showing sub-micrometre and sub-arcsecond correlation. The full eﬀect of a ballscrew pitch error is shown which can be missed using traditional quasi-static measurement techniques. Finally, wavelet analysis is performed for further spatial diagnostics along with correlation coeﬃcients calculated to quantify the linear dependency between the six error motions.
  key: b7f1f54c469a453bb9a7e5f4ea493eed
- type: Journal Articles
  title: 'Digital Forensics: Challenges and Opportunities for Future Studies'
  authors:
  - Reza Montasari
  - Richard Hill
  - Simon Parkinson
  - Pekka Peltola
  - Amin Hosseinian-Far
  - Alireza Daneshkhah
  venue: International Journal of Organizational and Collective Intelligence
  year: 2020
  month: 4
  volume: '10'
  number: '2'
  pages: 37–53
  publisher: IGI Global
  doi: 10.4018/IJOCI.2020040103
  abstract: Considering the ever-growing ubiquity of technology, there is an associated growth in the possibility of digital devices being related to a criminal investigation or civil litigation. GPS devices, unmanned aerial vehicles (UAVs), wearables, smart home devices, vehicle data collectors and smart phones are just a few of the digital devices that can produce evidential information during investigations. As the variety of digital devices is increasing, the storage capacity of each is also rising exponentially. Due to the varied and large volumes of data produced by these devices, law enforcement agencies (LEAs) worldwide are facing a significant backlog of cases. This in turn has culminated in significant delays in dealing with cases that urgently require digital forensic investigations (DFIs). Therefore, it is of paramount importance that new research approaches be adopted to address such challenges. To this end, this paper evaluates the existing set of circumstances surrounding
    the field of Digital Forensics (DF). Our research study makes two important contributions to the field of DF. First, it identifies and analyses the most important mid- and long-term challenges that need to be considered by LEAs. Second, it proposes important specific future research directions, the undertaking of which can assist LEAs in adopting a new approach to addressing these challenges.
  key: 54b2f3a58f274d4395c87827ed929a5c
- type: Journal Articles
  title: 'Creeper: a tool for detecting permission creep in file system access controls'
  authors:
  - Simon Parkinson
  - Saad Khan
  - James Bray
  - Daiyaan Shreef
  venue: Cybersecurity
  year: 2019
  month: 12
  volume: '2'
  number: '1'
  publisher: SpringerOpen
  doi: 10.1186/s42400-019-0031-1
  abstract: Access control mechanisms are widely used in multi-user IT systems where it is necessary to restrict access to computing resources. This is certainly true of file systems whereby information needs to be protected against unintended access. User permissions often evolve over time, and changes are often made in an ad hoc manner and do not follow any rigorous process. This is largely due to the fact that the structure of the implemented permissions are often determined by experts during initial system configuration and documentation is rarely created. Furthermore, permissions are often not audited due to the volume of information, the requirement of expert knowledge, and the time required to perform manual analysis. This paper presents a novel, unsupervised technique whereby a statistical analysis technique is developed and applied to detect instances of permission creep. The system (herein refereed to as Creeper) has initially been developed for Microsoft systems; however, it is
    easily extensible and can be applied to other access control systems. Experimental analysis has demonstrated good performance and applicability on synthetic file system permissions with an average accuracy of 96%. Empirical analysis is subsequently performed on five real-world systems where an average accuracy of 98% is established.
  key: 6779355d62d14499bf1e1ef9b5ecc56f
- type: Conference Papers
  title: Classifying Ransomware Using Machine Learning Algorithms
  authors:
  - Samuel Egunjobi
  - Simon Parkinson
  - Andrew Crampton
  editors:
  - Hujun Yin
  - David Camacho
  - Peter Tino
  - Antonio J. Tallón-Ballesteros
  - Ronaldo Menezes
  - Richard Allmendinger
  venue: Intelligent Data Engineering and Automated Learning - IDEAL 2019
  year: 2019
  month: 10
  volume: LNCS11872
  pages: 45–52
  publisher: Springer International Publishing
  doi: 10.1007/978-3-030-33617-2_5
  url: http://www.datascience.manchester.ac.uk/events-1/events/20th-international-conference-on-intelligent-data-engineering-and-automated-learning-ideal/
  abstract: Ransomware is a continuing threat and has resulted in the battle between the development and detection of new techniques. Detection and mitigation systems have been developed and are in wide-scale use; however, their reactive nature has resulted in a continuing evolution and updating process. This is largely because detection mechanisms can often be circumvented by introducing changes in the malicious code and its behaviour. In this paper, we demonstrate a classification technique of integrating both static and dynamic features to increase the accuracy of detection and classification of ransomware. We train supervised machine learning algorithms using a test set and use a confusion matrix to observe accuracy, enabling a systematic comparison of each algorithm. In this work, supervised algorithms such as the Naïve Bayes algorithm resulted in an accuracy of 96% with the test set result, SVM 99.5%, random forest 99.5%, and 96%. We also use Youden's index to determine sensitivity
    and specificity.
  key: 10190ff87dbd4b99a51b54c526a5b7d8
- type: Journal Articles
  title: Discovering and utilising expert knowledge from security event logs
  authors:
  - Saad Khan
  - Simon Parkinson
  venue: Journal of Information Security and Applications
  year: 2019
  month: 10
  volume: '48'
  pages: 1–22
  publisher: Elsevier Limited
  doi: 10.1016/j.jisa.2019.102375
  abstract: Vulnerability assessment and security configuration of computer systems is heavily dependent on human experts, which are widely attributed as being in short supply. This can result in a system being left insecure because of the lack of easily accessible experience and specialist resources. While performing security tasks, human experts often revert to a system's event logs to establish security information (configuration changes, errors, etc.). However, finding and exploiting knowledge from event logs is a challenging and time-consuming task for non-experts. Hence there is a strong need to provide mechanisms to make the process easier for security experts, as well as providing tools for those with significantly less security expertise. In this paper, we present a novel technique to process security event logs of a system that have been evaluated and configured by a security expert, extract key domain knowledge indicative of human decision making, and automatically apply acquired
    knowledge to previously unseen systems by non-experts to propose security improvements. The proposed solution utilises rule mining algorithms to extract security actions from event log entries. The set of identified rules is represented as a domain action model. The domain model and problem instance generated from a previously unseen system can then be used to produce a plan-of-action, which can be exploited by non-professionals to improve their system's security. Empirical analysis is subsequently performed on 21 event logs, where the acquired domain model and identified plans are discussed in terms of accuracy and performance.
  key: 79ee24d2a97f46f0937bd67de0dfed71
- type: Journal Articles
  title: 'TrustVote: Privacy-Preserving Node Ranking in Vehicular Networks'
  authors:
  - Muhammad Ajmal Azad
  - Samiran Bag
  - Simon Parkinson
  - Feng Hao
  venue: IEEE Internet of Things Journal
  year: 2019
  month: 8
  volume: '6'
  number: '4'
  pages: 5878–5891
  publisher: Institute of Electrical and Electronics Engineers Inc.
  doi: 10.1109/JIOT.2018.2880839
  abstract: The Internet of Vehicles is the network of connected vehicles and transport infrastructure units [roadside units (RSUs)], which utilizes emerging wireless systems (4G, 5G, LTE) for the communication and sharing of information. The network of connected vehicles enables users to disseminate critical information about events happening on the road (for example, accidents, traffic congestions, and hazards). The exchange of information between vehicles and RSUs could improve the driving experience and road safety, as well as help drivers to identify the hazardous and safe routes in a timely manner. The sharing of critical information between vehicles is advantageous to the driver; however, at the same time, malicious actors could mislead drivers by spreading fraudulent and fake messages. Fraudulent messages can have a negative impact on the infrastructure, and more significantly, have potential to cause threats to life. It is, therefore, essential that vehicles can evaluate the credibility
    of those who send messages (vehicles or RSUs) before taking any action. In this paper, we present TrustVote, a collaborative crowdsourcing-based vehicle reputation system that enables vehicles to evaluate the credibility of other vehicles in a connected vehicular network. The TrustVote system allows participating vehicles to hide their rating/feedback scores and the list of interacted vehicles under a homomorphic cryptographic layer, which can only be unfolded as an aggregate. The proposed approach also considers the trust weight of a vehicle providing the rating scores while computing the aggregate reputation of the vehicles. A prototype of TrustVote is developed and its performance is evaluated in terms of the computational and communication overheads.
  key: ef1818e89ed746708005758238887339
- type: Conference Papers
  title: Towards Automating Crime Prevention through Environmental Design (CPTED) Analysis to Predict Burglary
  authors:
  - Leanne Monchuk
  - Simon Parkinson
  - James Kitchen
  editors:
  - J. Benton
  - Nir Lipovetzky
  - Eva Onaindia
  - David E. Smith
  - Siddharth Srivastava
  venue: Proceedings of the Twenty-Ninth International Conference on Automated Planning and Scheduling
  year: 2019
  month: 7
  volume: '29'
  pages: 539–547
  publisher: Association for the Advancement of Artiﬁcial Intelligence
  doi: 10.1609/icaps.v29i1.3520
  url: https://icaps19.icaps-conference.org/
  abstract: The design of the built environment (such as housing developments, street networks) can increase the opportunity for crime and disorder to occur. For example, a housing development with poor surveillance can provide an opportunity for offenders to commit residential burglary and avoid detection. Crime Prevention through Environmental Design (CPTED) aims to reduce crime and disorder through the design and manipulation of the built environment. The police typically play an important role in the delivery and application of CPTED by assessing planning applications, identifying design features that may provide an opportunity for crime and offering remedial advice. In England and Wales, it is common practice for police specialists -- Designing out Crime Officers (DOCOs) -- to review architectural site plans during the planning process. However, owing to significant cuts to policing budgets, the number of DOCOs in post is reducing whilst the demand for new housing is on the increase.
    In this novel work, it is demonstrated that key knowledge about the opportunities for crime and disorder within the built environment can be elicited from a purposive sample of 28 experienced DOCOs, encoded in a domain model and utilised by Automated Planning techniques to automatically assess architectural site plans for future crime risk.
  key: 0d34120a167a452eb2748ecb0415c9cd
- type: Conference Papers
  title: Exploiting Automated Planning for Efficient Centralized Vehicle Routing and Mitigating Congestion in Urban Road Networks
  authors:
  - Lukáš Chrpa
  - Mauro Vallati
  - Simon Parkinson
  venue: Proceedings of The 34th ACM/SIGAPP Symposium on Applied Computing (SAC-19)
  year: 2019
  month: 4
  pages: 191–194
  publisher: Association for Computing Machinery (ACM)
  doi: 10.1145/3297280.3297539
  url: https://www.sigapp.org/sac/sac2019/
  abstract: One of the pivotal challenges presented to urban traffic controllers is the effective utilization of the transport infrastructure, as a result of the growing urbanization and of the increasing number of vehicles. In response to this challenge, here we investigate the use of Automated Planning for reducing congestion and maximizing the exploitation of urban networks, by generating routes for the vehicles navigating through the controlled region. Empirical analysis is performed on four case studies (including maps of actual UK urban areas) with different complexities and volume of vehicles. The results demonstrate the potential of the presented approach, leading towards an intelligent navigation system, which shows to be able to provide effective personalized directions to vehicles.
  key: a0ca148330594cdb826c8918285d64ce
- type: Journal Articles
  title: 'Eliciting and utilising knowledge for security event log analysis: an association rule mining and automated planning approach'
  authors:
  - Saad Khan
  - Simon Parkinson
  venue: Expert Systems with Applications
  year: 2018
  month: 12
  volume: '113'
  pages: 116–127
  publisher: Elsevier Limited
  doi: 10.1016/j.eswa.2018.07.006
  abstract: Vulnerability assessment and security configuration activities are heavily reliant on expert knowledge. This requirement often results in many systems being left insecure due to a lack of analysis expertise and access to specialist resources. It has long been known that a system’s event logs provide historical information depicting potential security breaches, as well as recording configuration activities. However, identifying and utilising knowledge within the event logs is challenging for the non-expert. In this paper, a novel technique is developed to process security event logs of a computer that has been assessed and configured by a security professional, extract key domain knowledge indicative of their expert decision making, and automatically apply learnt knowledge to previously unseen systems by non-experts. The technique converts event log entries into an object-based model and dynamically extracts associative rules. The rules are further improved in terms of quality
    using a temporal metric to autonomously establish temporal-association rules and acquire a domain model of expert configuration tasks. The acquired domain model and problem instance generated from a previously unseen system can then be used to produce a plan-of-action, which can be exploited by non-professionals to improve their system’s security. Empirical analysis is subsequently performed on 20 event logs, where identified plan traces are discussed in terms of accuracy and performance.
  key: c305b1ac9fd646619b256620c3c5ca0a
- type: Books
  title: 'Guide to Vulnerability Analysis for Computer Networks and Systems: An Artificial Intelligence Approach'
  editors:
  - Simon Parkinson
  - Andrew Crampton
  - Richard Hill
  venue: Computer Communications and Networks
  year: 2018
  month: 10
  publisher: Springer International Publishing
  doi: 10.1007/978-3-319-92624-7
  abstract: 'This professional guide and reference examines the challenges of assessing security vulnerabilities in computing infrastructure. Various aspects of vulnerability assessment are covered in detail, including recent advancements in reducing the requirement for expert knowledge through novel applications of artificial intelligence. The work also offers a series of case studies on how to develop and perform vulnerability assessment techniques using start-of-the-art intelligent mechanisms. Topics and features: provides tutorial activities and thought-provoking questions in each chapter, together with numerous case studies; introduces the fundamentals of vulnerability assessment, and reviews the state of the art of research in this area; discusses vulnerability assessment frameworks, including frameworks for industrial control and cloud systems; examines a range of applications that make use of artificial intelligence to enhance the vulnerability assessment processes; presents visualisation
    techniques that can be used to assist the vulnerability assessment process. In addition to serving the needs of security practitioners and researchers, this accessible volume is also ideal for students and instructors seeking a primer on artificial intelligence for vulnerability assessment, or a supplementary text for courses on computer security, networking, and artificial intelligence.'
  key: abca2a23075a4a119787bbfd8e15a196
- type: Book Chapters
  title: Review into State of the Art of Vulnerability Assessment using Artificial Intelligence
  authors:
  - Saad Khan
  - Simon Parkinson
  editors:
  - Simon Parkinson
  - Andrew Crampton
  - Richard Hill
  venue: Guide to Vulnerability Analysis for Computer Networks and Systems
  year: 2018
  month: 10
  pages: 3–32
  publisher: Springer, Cham
  doi: 10.1007/978-3-319-92624-7_1
  abstract: Vulnerability assessment is the essential and well-established process of probing security flaws, weaknesses and inadequacies in a computing infrastructure. The process helps organisations to eliminate security issues before attackers can exploit them for monetary gains or other malicious purposes. The significant advancements in desktop, Web and mobile computing technologies have widened the range of security-related complications. It has become an increasingly crucial challenge for security analysts to devise comprehensive security evaluation and mitigation tools that can protect the business-critical operations. Researchers have proposed a variety of methods for vulnerability assessment, which can be broadly categorised into manual, assistive and fully automated. Manual vulnerability assessment is performed by a human expert, based on a specific set of instructions that are aimed at finding the security vulnerability. This method requires a large amount of time, effort and
    resources, and it is heavily reliant on expert knowledge, something that is widely attributed to being in short supply. The assistive vulnerability assessment is conducted with the help of scanning tools or frameworks that are usually up-to-date and look for the most relevant security weakness. However, the lack of flexibility, compatibility and regular maintenance of tools, as they contain static knowledge, renders them outdated and does not provide the beneficial information (in terms of depth and scope of tests) about the state of security. Fully automated vulnerability assessment leverages artificial intelligence techniques to produce expert-like decisions without human assistance and is by far considered as the most desirable (due to time and financial reduction for the end-user) method of evaluating a systems’ security. Although being highly desirable, such techniques require additional research in improving automated knowledge acquisition, representation and learning mechanisms.
    Further research is also needed to develop automated vulnerability mitigation techniques that are capable of actually securing the computing platform. The volume of research being performed into the use of artificial intelligence techniques in vulnerability assessment is increasing, and there is a need to provide a survey into the state of the art.
  key: 83ad036ef0294e9abafeac4493380757
- type: Book Chapters
  title: 'Automated Planning of Administrative Tasks Using Historic Events: A File System Case Study'
  authors:
  - Saad Khan
  - Simon Parkinson
  editors:
  - Simon Parkinson
  - Andrew Crampton
  - Richard Hill
  venue: Guide to Vulnerability Analysis for Computer Networks and Systems
  year: 2018
  month: 9
  pages: 159–182
  publisher: Springer, Cham
  doi: 10.1007/978-3-319-92624-7_7
  abstract: Understanding how to implement file system access control rules within a system is heavily reliant on expert knowledge, both that intrinsic to how a system can be configured as well as how a current configuration is structured. Maintaining the required level of expertise in fast-changing environments, where frequent configuration changes are implemented, can be challenging. Another set of complexities lies in gaining structural understanding of large volumes of permission information. The accuracy of a new addition within a file system access control is essential, as inadvertently assigning rights that result in a higher than necessary level of access can generate unintended vulnerabilities. To address these issues, a novel mechanism is devised to automatically process a system’s event history to determine how previous access control configuration actions have been implemented and then utilise the model for suggesting how to implement new access control rules. Throughout this
    paper, we focus on Microsoft’s New Technology File System permissions (NTFS) access control through processing operating system generated log data. We demonstrate how the novel technique can be utilised to plan for the administrator when assigning new permissions. The plans are then evaluated in terms of their validity as well as the reduction in required expert knowledge.
  key: 5f35ce4b77a64ef0ab62a10f19bec338
- type: Book Chapters
  title: Identifying File Interaction Patterns in Ransomware Behaviour
  authors:
  - Liam Grant
  - Simon Parkinson
  editors:
  - Simon Parkinson
  - Andrew Crampton
  - Richard Hill
  venue: Guide to Vulnerability Analysis for Computer Networks and Systems
  year: 2018
  month: 9
  pages: 317–335
  publisher: Springer, Cham
  doi: 10.1007/978-3-319-92624-7_14
  abstract: Malicious software (Malware) has a rich history of causing significant challenges for both users and system developers alike. The development of different malware types is often resulting from criminal opportunity, and the monetisation of ransomware, coupled with the continuously growing importance of user data, is resulting in ransomware becoming one of the most prominent forms of malware. Detecting and stopping ransomware from executing is challenging due to the large verity of different types, as well as the speed of new instances being developed. This results in static approaches, such as using signatures, ineffective in many instances. This chapter investigates the behavioural analysis of ransomware, and in particular focussed on its interaction with the underlying file system. This study identifies that ransomware instances have unique behavioural patterns, which are significantly different from those of normal user interaction.
  key: e1ba384701904da1838d9ce65e2eafec
- type: Journal Articles
  title: 'Adaptive Decision Support for Suggesting a Machine Tool Maintenance Strategy: From Reactive to Preventative'
  authors:
  - Abubaker Shagluf
  - Simon Parkinson
  - Andrew Longstaff
  - Simon Fletcher
  venue: Journal of Quality in Maintenance Engineering
  year: 2018
  month: 8
  volume: '24'
  number: '3'
  pages: 376–399
  publisher: Emerald Publishing
  doi: 10.1108/JQME-02-2017-0008
  abstract: 'Purpose: The purpose of this paper is to produce a decision support aid for machine tool owners to utilise while deciding upon a maintenance strategy. Furthermore, the decision support tool is adaptive and capable of suggesting different strategies by monitoring for any change in machine tool manufacturing accuracy. Design/methodology/approach: A maintenance cost estimation model is utilised within the research and development of this decision support system (DSS). An empirical-based methodology is pursued and validated through case study analysis. Findings: A case study is provided where a schedule of preventative maintenance actions is produced to reduce the need for the future occurrences of reactive maintenance actions based on historical machine tool accuracy information. In the case study, a 28 per cent reduction in predicted accuracy-related expenditure is presented, equating to a saving of £14k per machine over a five year period. Research limitations/implications: The
    emphasis on improving machine tool accuracy and reducing production costs is increasing. The presented research is pioneering in the development of a software-based tool to help reduce the requirement on domain-specific expert knowledge. Originality/value: The paper presents an adaptive DSS to assist with maintenance strategy selection. This is the first of its kind and is able to suggest a preventative strategy for those undertaking only reactive maintenance. This is of value for both manufacturers and researchers alike. Manufacturers will benefit from reducing maintenance costs, and researchers will benefit from the development and application of a novel decision support technique.'
  key: bb1d9922b0354df38feb2dd0d649d282
- type: Journal Articles
  title: 'GraphBAD: A General Technique for Anomaly Detection in Security Information and Event Management'
  authors:
  - Simon Parkinson
  - Mauro Vallati
  - Andrew Crampton
  - Shirin Sohrabi
  venue: Concurrency Computation Practice and Experience
  year: 2018
  month: 8
  volume: '30'
  number: '16'
  publisher: John Wiley and Sons Ltd
  doi: 10.1002/cpe.4433
  abstract: The reliance on expert knowledge –required for analysing security logs and performing security audits– has created an unhealthy balance where many computer users are not able to correctly audit their security configurations and react to potential security threats. The decreasing cost of IT and the increasing use of technology in domestic life is exacerbating this problem where small companies and home IT users are not able to afford the price of experts for auditing their systems configuration. In this paper we present GraphBAD, a graph-based analysis tool able to analyse security configurations in order to identify anomalies that could lead to potential security risks. system, which does not require any prior domain knowledge, generates graph-based models from security configuration data and, by analysing such models, is able to propose mitigation plans that can help computer users in increasing the security of their systems. A large experimental analysis, conducted on both
    publicly available (the well-known KDD dataset) and synthetically generated testing sets (file system permissions), demonstrates the ability of GraphBAD in correctly identifying security configurations anomalies and suggesting appropriate mitigation plans.
  key: 559da2f199e146adbc3798d4cf0dee93
- type: Journal Articles
  title: Identifying Irregularities in Security Event Logs through an Object-based Chi-squared Test of Independence
  authors:
  - Simon Parkinson
  - Saad Khan
  venue: Journal of Information Security and Applications
  year: 2018
  month: 6
  volume: '40'
  pages: 52–62
  publisher: Elsevier Limited
  doi: 10.1016/j.jisa.2018.03.003
  abstract: 'A novel technique for identifying irregular event log entries is presented in this paper along with the implementation in a Microsoft Windows-based environment. The motivation behind this research is to identify irregular activity in a system whilst minimising any requirement on expert knowledge, in addition to saving investigative time and computing resources. As the developed solution utilises the standard Microsoft format for event logs, it can work with both live systems, as well as events extracted and stored for off-site analysis. The solution consists of two major steps: first, convert the event logs into objects- based model and second, perform statistical analysis using the Chi-squared (χ2) test of independence and classify mean χ2 values into discrete categories using Jenks natural breaks method. The event logs entries, which failed the test of dependence are considered as irregular events. It is also shown that the proposed solution poses an advantage over primitive
    frequency analysis methods as it uses object relationships among event log entries to determine irregularities for locating anomalous activities. Empirical analysis of the solution is performed using event logs data from 20 machines and shows promising results by correctly identifying irregular events. Further experimental analysis involving the insertion of synthetic irregular events results in an average accuracy of 85%.'
  key: 24414a307f044e8187598a5ab09b2343
- type: Technical Reports
  title: 'Rapid Evidence Assessment: Quantifying Online Facilitated Child Sexual Abuse: Report for the Independent Inquiry into Child Sexual Abuse'
  authors:
