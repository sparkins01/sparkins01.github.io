  - Mauro Vallati
  - Lukáš Chrpa
  - Andrew P. Longstaff
  - Simon Fletcher
  venue: 10th Scheduling and Planning Applications woRKshop (SPARK), King's College London
  year: 2016
  month: 6
- type: Book Chapters
  title: Optimising Measurement Processes Using Automated Planning
  authors:
  - Simon Parkinson
  - Andrew Crampton
  - Andrew Longstaff
  editors:
  - Franco Pavese
  - Wolfram Bremser
  - Anna Chunovkina
  - Nicolas Fischer
  - Alistair B Forbes
  venue: Advanced Mathematical and Computational Tools in Metrology and Testing X
  year: 2015
  month: 6
  volume: '86'
  pages: 286–292
  publisher: World Scientific
  abstract: Many commercial measurement processes are planned with little or no regard to optimality in terms of measurement time and the estimated uncertainty of measurement. This can be because the complexity of the planning problem makes optimality in a dynamic environment difficult to achieve, even with expert knowledge. This paper presents a novel approach to measurement planning using automated planning. Detailed information regarding the modelling and encoding of measurement processes are provided. The benefits of this approach are demonstrated through the results of applying it to machine tool calibration. A discussion is then formed around the development of future tools to further validate the approach.
  key: 5321dae46f8a4b7387b07a60816f7228
- type: Journal Articles
  title: Multi-objective optimisation of machine tool error mapping using automated planning
  authors:
  - S. Parkinson
  - A. P. Longstaff
  venue: Expert Systems with Applications
  year: 2015
  month: 4
  volume: '42'
  number: '6'
  pages: 3005–3015
  publisher: Elsevier Limited
  doi: 10.1016/j.eswa.2014.11.066
  abstract: Error mapping of machine tools is a multi-measurement task that is planned based on expert knowledge. There are no intelligent tools aiding the production of optimal measurement plans. In previous work, a method of intelligently constructing measurement plans demonstrated that it is feasible to optimise the plans either to reduce machine tool downtime or the estimated uncertainty of measurement due to the plan schedule. However, production scheduling and a continuously changing environment can impose conflicting constraints on downtime and the uncertainty of measurement. In this paper, the use of the produced measurement model to minimise machine tool downtime, the uncertainty of measurement and the arithmetic mean of both is investigated and discussed through the use of twelve different error mapping instances. The multi-objective search plans on average have a 3% reduction in the time metric when compared to the downtime of the uncertainty optimised plan and a 23% improvement
    in estimated uncertainty of measurement metric when compared to the uncertainty of the temporally optimised plan. Further experiments on a High Performance Computing (HPC) architecture demonstrated that there is on average a 3% improvement in optimality when compared with the experiments performed on the PC architecture. This demonstrates that even though a 4% improvement is beneficial, in most applications a standard PC architecture will result in valid error mapping plan.
  key: 207ad6bf35ea40d78b14e0df4c29f793
- type: Technical Reports
  title: Review into the cyber threats for connected and autonomous vehicles
  authors:
  - Simon Parkinson
  - Paul Ward
  venue: Department for Transport
  year: 2015
- type: Conference Papers
  title: Automated Planning for File System Interaction
  authors:
  - Simon Parkinson
  - Dean Hardcastle
  venue: 32nd Workshop of the UK Planning and Scheduling Special Interest Group (PlanSIG), Darlington, UK
  year: 2014
  month: 12
- type: Journal Articles
  title: 'Automated Planning for Multi-Objective Machine Tool Calibration: Optimising Makespan and Measurement Uncertainty'
  authors:
  - Simon Parkinson
  - Peter Gregory
  - Andrew P. Longstaff
  - Andrew Crampton
  venue: Proceedings International Conference on Automated Planning and Scheduling, ICAPS
  year: 2014
  month: 5
  volume: '24'
  pages: 421–429
  publisher: Association for the Advancement of Artiﬁcial Intelligence
  doi: 10.1609/icaps.v24i1.13662
  url: http://icaps14.icaps-conference.org/
  abstract: The evolution in precision manufacturing has resulted in the requirement to produce and maintain more accurate machine tools. This new requirement coupled with desire to reduce machine tool downtime places emphasis on the calibration procedure during which the machine's capabilities are assessed. Machine tool downtime is significant for manufacturers because the machine will be unavailable for manufacturing use, therefore wasting the manufacturer's time and potentially increasing lead-times for clients. In addition to machine tool downtime, the uncertainty of measurement, due to the schedule of the calibration plan, has significant implications on tolerance conformance, resulting in an increased possibility of false acceptance and rejection of machined parts. The work presented in this paper is focussed on expanding a developed temporal optimisation model to reduce the uncertainty of measurement. Encoding the knowledge in regular PDDL requires the discretization of non-linear,
    continuous temperature change and implementing the square root function. The implementation shows that not only can domain-independent automated planning reduce machine downtime by 10.6% and the uncertainty of measurement by 59%, it is also possible to optimise both metrics reaching a compromise that is on average 9% worse that the best-known solution for each individual metric.
  key: 76bc155e0cb34f37ae6957e718776c98
- type: Journal Articles
  title: Automated planning to minimise uncertainty of machine tool calibration
  authors:
  - S. Parkinson
  - A. P. Longstaff
  - S. Fletcher
  venue: Engineering Applications of Artificial Intelligence
  year: 2014
  month: 4
  volume: '30'
  pages: 63–72
  publisher: Elsevier Limited
  doi: 10.1016/j.engappai.2014.02.002
  abstract: When calibrating a machine tool, multiple measurement tasks will be performed, each of which has an associated uncertainty of measurement. International Standards and best-practice guides are available to aid with estimating uncertainty of measurement for individual tasks, but there is little consideration for the temporal influence on the uncertainty when considering interrelated measurements. Additionally, there is an absence of any intelligent method capable of optimising (reducing) the estimated uncertainty of the calibration plan as a whole. In this work, the uncertainty of measurement reduction problem is described and modelled in a suitable language to allow state-of-the-art artificial intelligence planning tools to produce optimal calibration plans. The paper describes how the continuous, non-linear temperature aspects are discretized and modelled to make them easier for the planner to solve. In addition, detail is provided as how the complex uncertainty equations are
    modelled in a restrictive language where its syntax heavily influences the encoding. An example is shown for a three-axis machine, where the produced plan exhibits intelligent behaviour in terms of scheduling measurements against temperature deviation and the propagation of error uncertainties. In this example, a reduction of 58% in the estimated uncertainty of measurement due to intelligently scheduling a calibration plan is observed. This reduction in the estimated uncertainty of measurement will result in an increased conformance zone, thus reducing false acceptance and rejection of work-pieces.
  key: 8dd36c9fd1f541308195a6ffa4380a24
- type: Conference Papers
  title: Towards an Optimization Calculation for Preventative and Reactive Calibration Strategies
  authors:
  - Abubaker Shagluf
  - Andrew Longstaff
  - Simon Fletcher
  - Simon Parkinson
  editors:
  - Rossi Setchi
  - Robert J. Howlett
  - Mohamed Naim
  - Hans Seinz
  venue: Sustainable Design and Manufacturing 2014
  year: 2014
  month: 4
  volume: '1'
  pages: 83–94
  publisher: KES International
  url: http://sdm-14.kesinternational.org/
  abstract: Minimising manufacturing waste and reducing downtime are becoming increasingly important to industrial companies, especially those manufacturing with high levels of output or to a high level of accuracy, such as mobile phone, submarine, and aircraft. Increasingly, predictable output quality from machine tools relies on systematic calibration to improve and maintain their capabilities, as well as to reduce waste in terms of scrapped parts and energy from re-manufacturing. However, such calibrations remove the machine from normal manufacturing duties, which could have large financial implications. This paper presents a cost optimisation process that is used to reduce unnecessary downtime while maintaining the machine at the required capability. The concept of this work will ultimately lead to a technically-driven management tool that can optimise the schedule of a calibration plan. In the paper we use a case study to validate the presented technique for both preventative and reactive
    calibration strategies. This case study shows that the calibration cost for both strategies can be decreased by intelligently reducing machine tool downtime. This results in the cost of using a preventative strategy being reduced, making it a commercially attractive alternative to reacting to failure, increasing the feasibility of using reactive calibration.
  key: a55ce620b0ba4e6790f043f1d93b76da
- type: Journal Articles
  title: A method for rapid detection and evaluation of position errors of patterns of small holes on complex curved and freeform surfaces
  authors:
  - Xiaomei Chen
  - Andrew Longstaff
  - Simon Parkinson
  - Alan Myers
  venue: International Journal of Precision Engineering and Manufacturing
  year: 2014
  month: 2
  volume: '15'
  number: '2'
  pages: 209–217
  publisher: Korean Society of Precision Engineering
  doi: 10.1007/s12541-014-0327-8
  abstract: This paper presents an evaluation method for the rapid and automatic detection of position errors of arrays of small holes on complex-curved and freeform surfaces that can satisfy the special demands of the aviation and automobile industries. The evaluation is based on the dual-sensor autofocusing method. The dual-sensor unit is the combination of a tactile probe and an optical vision sensor. The tactile probe detects the focal position for the optical vision sensor by probing the distance between the objective lens of the microscope and the location of each small hole. The optical vision sensor focuses to this position for capturing the image of the artifact under inspection. As a case study, a pattern of φ 0.5 mm small holes centripetally drilled with equal-angular distribution on the circumference of an elliptical cylinder shell is investigated. The autofocusing errors caused by the radius of the tactile probe and the position errors of the small holes are evaluated mathematically.
    Subsequently, a standalone dual-sensor autofocusing unit is built and integrated into a user-controllable 3D coordinate test rig. It is used to autofocus and capture the images of small holes. The centroid positions and deviations of the holes are automatically and rapidly detected from the captured images.
  key: 37d482b2d8bd4ece9ebfaa9406732f0d
- type: Journal Articles
  title: A Novel Software Tool for Analysing NT File System Permissions
  authors:
  - Simon Parkinson
  - Andrew Crampton
  venue: International Journal of Advanced Computer Science and Applications
  year: 2013
  month: 6
  volume: '4'
  number: '6'
  pages: 266–272
  publisher: Science and Information Organization
  doi: 10.14569/IJACSA.2013.040635
  abstract: Administrating and monitoring New Technology File System (NTFS) permissions can be a cumbersome and convoluted task. In today's data rich world there has never been a more important time to ensure that data is secured against unwanted access. This paper identifies the essential and fundamental requirements of access control, highlighting the main causes of their misconfiguration within the NTFS. In response, a number of features are identified and an efficient, informative and intuitive software-based solution is proposed for examining file system permissions. In the first year that the software has been made freely available it has been downloaded and installed by over four thousand users
  key: 4c7e8d177ff14b319abe3be70c2629b8
- type: Journal Articles
  title: The role of measurement and modelling of machine tools in improving product quality
  authors:
  - A. P. Longstaff
  - S. Fletcher
  - S. Parkinson
  - A. Myers
  venue: International Journal of Metrology and Quality Engineering
  year: 2013
  volume: '4'
  number: '3'
  pages: 177–184
  publisher: EDP Sciences
  doi: 10.1051/ijmqe/2013054
  abstract: Manufacturing of high-quality components and assemblies is clearly recognised by industrialised nations as an important means of wealth generation. A "right first time" paradigm to producing finished components is the desirable goal to maximise economic benefits and reduce environmental impact. Such an ambition is only achievable through an accurate model of the machinery used to shape the finished article. In the first analysis, computer aided design (CAD) and computer aided manufacturing (CAM) can be used to produce an instruction list of three-dimensional coordinates and intervening tool paths to translate the intent of a design engineer into an unambiguous set of commands for a manufacturing machine. However, in order for the resultant manufacturing program to produce the desired output within the specified tolerance, the model of the machine has to be sufficiently accurate. In this paper, the spatial and temporal sources of error and various contemporary means of modelling
    are discussed. Limitations and assumptions in the models are highlighted and an estimate of their impact is made. Measurement of machine tools plays a vital role in establishing the accuracy of a particular machine and calibrating its unique model, but is an often misunderstood and misapplied discipline. Typically, the individual errors of the machine will be quantified at a given moment in time, but without sufficient consideration either for the uncertainty of individual measurements or a full appreciation of the complex interaction between each independently measured error. This paper draws on the concept of a "conformance zone", as specified in the ISO 230:1-2012, to emphasise the need for a fuller understanding of the complex uncertainty of measurement model for a machine tool. Work towards closing the gap in this understanding is described and limitations are noted.
  key: a1526fd9f53a4ed9a0f43de4ec032d50
- type: Journal Articles
  title: 'Automatic planning for machine tool calibration: A case study'
  authors:
  - S. Parkinson
  - A. P. Longstaff
  - S. Fletcher
  - A. Crampton
  - Peter Gregory
  venue: Expert Systems with Applications
  year: 2012
  month: 10
  volume: '39'
  number: '13'
  pages: 11367–11377
  publisher: Elsevier Limited
  doi: 10.1016/j.eswa.2012.03.054
  abstract: Machine tool owners require knowledge of their machine's capabilities, and the emphasis increases with areas of high accuracy manufacturing. An aspect of a machine's capability is its geometric accuracy. International Standards and best-practice guides are available to aid understanding of the required measurements and to advise on how to perform them. However, there is an absence of any intelligent method capable of optimising the duration of a calibration plan, minimising machine down-time. In this work, artificial intelligence in the form of automated planning is applied to the problem of machine tool pseudo-static geometric error calibration. No prior knowledge of Artificial Intelligence (AI) planning is required throughout this paper. The authors have written this paper for calibration engineers to see the benefits that automated planning can provide. Two models are proposed; the first produces a sequential calibration plan capable of finding the optimal calibration plan.
    The second model has the additional possibility of planning for concurrent measurements, adding the possibility of further reducing machine down-time. Both models take input regarding a machine's configuration and available instrumentation. The efficacy of both models is evaluated by performing a case study of a five-axis gantry machine, whereby calibration plans are produced and compared against both an academic and industrial expert. From this, the effectiveness of this novel method for producing optimal calibration plan is evaluated, stimulating potential for future work.
  key: 4288e1d169034e29b865657e1dab03b0
- type: Conference Papers
  title: The Use of Cryptographic Principles Within Metrology Software
  authors:
  - Simon Parkinson
  - Andrew P. Longstaff
  - Andrew Crampton
  - Gary Allen
  - Simon Fletcher
  - Alan Myers
  editors:
  - Franco Pavese
  - Markus Bär
  - Jean-Rémy Filtz
  - Alistair B. Forbes
  - Leslie Pendrill
  - Katsuhiro Shirono
  venue: Advanced Mathematical and Computational Tools in Metrology and Testing IX
  year: 2012
  month: 3
  pages: 292–296
  publisher: World Scientific Publishing Co.
  doi: 10.1142/9789814397957_0036
  abstract: Typically the design and production of metrology software is based upon a rigorous process of establishing the software requirements. Both the metrology and security requirements will be processed and normally evaluated in isolation, or at best simultaneously. With the use of cryptographic principles, and the more prominent objectoriented programming languages, a new security-centric philosophy to metrology software design and production is presented to provide secure, robust and functional metrology software.
  key: 36a3fbc3b6ac44baa7ba5adf636c6cc7
- type: Conference Papers
  title: Increasing the Numeric Expressiveness of the Planning Domain Definition Language
  authors:
  - Simon Parkinson
  - Andrew P. Longstaff
  venue: 30th Workshop of the UK Planning and Scheduling Special Interest Group (PlanSIG 2012)
  year: 2012
- type: Conference Papers
  title: The application of automated planning to machine tool calibration
  authors:
  - Simon Parkinson
  - Andrew P. Longstaff
  - Andrew Crampton
  - Peter Gregory
  venue: ICAPS 2012 - Proceedings of the 22nd International Conference on Automated Planning and Scheduling
  year: 2012
  pages: 216–224
  url: http://icaps12.icaps-conference.org/
  abstract: Engineering companies working with machine tools will often be required to calibrate those machines to international standards. The calibration process requires various errors in the machine to be measured by a skilled expert. In addition to conducting the tests, the engineer must also plan the order in which the tests should take place, and also which instruments should be used to perform each test. It is critical to find as short a calibration plan as possible so that the machine is not out of service for too long. In this work, automated planning is applied to the problem of generating machine tool calibration plans. Given a description of a machine, and its various axes, we produce a calibration plan that minimises the time taken to measure all of the errors of a machine. We also consider the case when there is not enough time to test all errors of the machine, and the calibration plan must maximise the importance of the set of errors tested in the limited time available.
  key: ac3dcf29327240b8927c1db0f1d6d9b1
- type: Conference Papers
  title: Hierarchical Task Based Process Planning For Machine Tool Calibration
  authors:
  - Simon Parkinson
  - Andrew P. Longstaff
  - Gary Allen
  - Andrew Crampton
  - Simon Fletcher
  - Alan Myers
  venue: 29th Workshop of the UK Planning and Scheduling Special Interest Group (PlanSIG 2011)
  pages: 53–60
  year: 2011
- type: Conference Papers
  title: Representing the process of machine tool calibration on first-order logic
  authors:
  - S. Parkinson
  - A. P. Longstaff
  - A. Crampton
  - S. Fletcher
  - G. Allen
  - A. Myers
  venue: Proceedings of 2011 17th International Conference on Automation and Computing, ICAC 2011
  year: 2011
  pages: 22–27
  url: http://www.wikicfp.com/cfp/servlet/event.showcfp?eventid=14139&copyownerid=20561
  abstract: Machine tool calibration requires a wide range of measurement techniques that can be carried out in many different sequences. Planning a machine tool calibration is typically performed by a subject expert with a great understanding of International standards and industrial best-practice guides. However, it is often the case that the planned sequence of measurements is not the optimal. Therefore, in an attempt to improve the process, intelligent computing methods can be designed for plan suggestion. As a starting point, this paper presents a way of converting expert knowledge into first-order logic that can be expressed in the PROLOG language. It then shows how queries can be executed against the logic to construct a knowledge-base of all the different measurements that can be performed during machine tool calibration.
  key: b02c96d1306a4e74b9196d483eb353df
