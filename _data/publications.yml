  doi: 10.1007/s12198-026-00328-z
  abstract: 'We present a simulation framework for analysing cyber-attacks on intelligent railway control systems, based on threat modelling. The system simulates a TCP/IP communication link between a control centre (server) and a train unit (client), transmitting real-time operational data such as speed and signal status. The simulation includes: (1) train behaviour modelling using OpenRails and MATLAB, (2) control centre logic in MATLAB, and (3) network communication and attack emulation in real-time. Two attack scenarios are evaluated: DoS attack that floods the server with fake requests, and a Jamming attack that injects noise into the FR medium. Performance metrics such as packet loss, latency, and response time are recorded under normal, attack, and recovery phases using MATLAB Simulink. Results show increased delays, packet loss, and reduced system reliability during attacks. Telemetry data and visualisations highlight system degradation and recovery behaviour. The framework offers
    a practical model for simulating real-world cyber threats against railway communication systems.'
