  abstract: Face anti-spoofing detection (FASD) has become a crucial technology due to the alarming advancements in presentation attacks (PAs). As more novel PAs with realistic generative capabilities emerge, improved biometric security solutions are needed to address these evolving threats. In early and foundational work, FASD techniques focused mainly on handcrafted features that were unreliable due to their limited representation capacity. In the recent decade, with the advancements in deep learning and its capabilities for image processing tasks and the emergence of large datasets, improvements in the performance of detecting PAs have been achieved. However, as research progresses rapidly, there is an absence of a comprehensive analysis of detection methods to understand the strengths and weaknesses of different types of approaches. Although various approaches utilise sensors in addition to RGB cameras, in this paper, we focus specifically on RGB camera-based methods and provide a comprehensive
    review of deep learning-based FASDs, including generalised models developed to date. In addition, the datasets are presented, along with the evaluation protocols and metrics.
