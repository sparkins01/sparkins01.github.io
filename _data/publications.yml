  abstract: 'Quantum computing offers transformative potential to solve complex optimisation problems in transportation and logistics, particularly those that involve large combinatorial decision spaces such as vehicle routing, traffic control, and supply chain design. Despite theoretical promise and growing empirical interest, its adoption remains limited. This systematic literature review synthesises fifteen peer-reviewed studies published between 2015 and 2025, examining the application of quantum and quantum-inspired methods to transport optimisation. The review identifies five key problem domains (vehicle routing, factory scheduling, network design, traffic operations, and energy management) and categorises the quantum techniques used, including quantum annealing, variational circuits, and digital annealers. Although several studies demonstrate performance gains over classical heuristics, most rely on synthetic datasets, lack statistical robustness, and omit critical operational metrics
    such as energy consumption and queue latency. Four cross-cutting barriers are identified: hardware limitations, data availability, energy inefficiency, and organisational readiness. The review identifies limited real-world deployment, a lack of standardised benchmarks, and scarce cost--benefit evaluations, highlighting key areas where further empirical work is needed. It concludes with a structured research agenda aimed at bridging the gap between laboratory demonstrations and practical implementation, emphasising the need for pilot trials, open datasets, robust experimental protocols, and interdisciplinary collaboration.'
