  - Carla Reeves
  - Maria Ioannou
  - John Synnott
  year: 2018
  month: 1
  publisher: Home Office
  key: 4131d5617c7942eb9c3ae34e3270535f
- type: Conference Papers
  title: A Multi-layered Cloud Protection Framework
  authors:
  - Saad Khan
  - Simon Parkinson
  - Andrew Crampton
  venue: 'Proceedings of the 10th International Conference on Utility and Cloud Computing (UCC), (Austin, TX: 5-8 December 2017)'
  year: 2017
  month: 12
  pages: 233–238
  publisher: Association for Computing Machinery (ACM)
  doi: 10.1145/3147234.3148098
  url: http://www.depts.ttu.edu/cac/conferences/ucc2017/
  abstract: Cloud computing has many commercial advantages; however, companies tend to avoid trusting cloud service providers (CSPs) with their sensitive data because of the associated risks. Cloud infrastructures can be vulnerable due to a single flaw in any node with networking, computing, storage and authentication services capabilities, which can result in the exposure of vulnerabilities with severe consequences. This paper reviews various recent articles and determines the most prominent security challenges. The paper also includes the critical analysis of existing solutions to determine their limitations. Using these identified limitations, a multi-layered security framework is proposed that can be integrated within cloud components to resolve data, virtualization, access control, insiders and service unavailability challenges. A theoretical evaluation of the framework is also conducted to explore its benefits.
  key: c6a8c69585d847b0aaf172736bcb52b8
- type: Conference Papers
  title: Causal Connections Mining Within Security Event Logs
  authors:
  - Saad Khan
  - Simon Parkinson
  venue: 'Proceedings of the 9th International Conference on Knowledge Capture (K-CAP), (Austin, TX: 4-6 December 2017)'
  year: 2017
  month: 12
  publisher: Association for Computing Machinery (ACM)
  doi: 10.1145/3148011.3154476
  url: https://k-cap2017.org/
  abstract: Performing both security vulnerability assessment and configuration processes are heavily reliant on expert knowledge. This requirement often results in many systems being left insecure due to a lack of analysis expertise and access to specialist resources. It has long been known that a system's event log provides historical information depicting potential security threats, as well as recording configuration activities. In this paper, a novel technique is developed that can process security event logs on a computer that has been assessed and configured by a security professional, and autonomously establish causality amongst event log entries to learn performed configuration tasks. This extracted knowledge can then be exploited by non-professionals to plan steps that can improve the security of a previously unseen system
  key: 4551724f16fe4e16b1d0a59026d9dbfe
- type: Journal Articles
  title: 'Cyber Threats Facing Autonomous and Connected Vehicles: Future Challenges'
  authors:
  - Simon Parkinson
  - Paul Ward
  - Kyle Wilson
  - Jonathan Miller
  venue: IEEE Transactions on Intelligent Transportation Systems
  year: 2017
  month: 11
  volume: '18'
  number: '11'
  pages: 2898–2915
  publisher: Institute of Electrical and Electronics Engineers Inc.
  doi: 10.1109/TITS.2017.2665968
  abstract: Vehicles are currently being developed and sold with increasing levels of connectivity and automation. As with all networked computing devices, increased connectivity often results in a heightened risk of a cyber security attack. Furthermore, increased automation exacerbates any risk by increasing the opportunities for the adversary to implement a successful attack. In this paper, a large volume of publicly accessible literature is reviewed and compartmentalized based on the vulnerabilities identified and mitigation techniques developed. This review highlighted that the majority of studies are reactive and vulnerabilities are often discovered by friendly adversaries (white-hat hackers). Many gaps in the knowledge base were identified. Priority should be given to address these knowledge gaps to minimize future cyber security risks in the connected and autonomous vehicle sector.
  key: e3f2d9266c9348eba937e3c90f646ce3
- type: Journal Articles
  title: Efficient computation of distance labeling for decremental updates in large dynamic graphs
  authors:
  - Yongrui Qin
  - Quan Z. Sheng
  - Nickolas J G Falkner
  - Lina Yao
  - Simon Parkinson
  venue: World Wide Web
  year: 2017
  month: 9
  volume: '20'
  number: '5'
  pages: 915–937
  publisher: Springer New York
  doi: 10.1007/s11280-016-0421-1
  abstract: Since today’s real-world graphs, such as social network graphs, are evolving all the time, it is of great importance to perform graph computations and analysis in these dynamic graphs. Due to the fact that many applications such as social network link analysis with the existence of inactive users need to handle failed links or nodes, decremental computation and maintenance for graphs is considered a challenging problem. Shortest path computation is one of the most fundamental operations for managing and analyzing large graphs. A number of indexing methods have been proposed to answer distance queries in static graphs. Unfortunately, there is little work on answering such queries for dynamic graphs. In this paper, we focus on the problem of computing the shortest path distance in dynamic graphs, particularly on decremental updates (i.e., edge deletions). We propose maintenance algorithms based on distance labeling, which can handle decremental updates efficiently. By exploiting
    properties of distance labeling in original graphs, we are able to efficiently maintain distance labeling for new graphs. We experimentally evaluate our algorithms using eleven real-world large graphs and confirm the effectiveness and efficiency of our approach. More specifically, our method can speed up index re-computation by up to an order of magnitude compared with the state-of-the-art method, Pruned Landmark Labeling (PLL).
  key: 4eb4c0fa9a76487d8097623db81898a3
- type: Journal Articles
  title: 'A Hybrid Approach to Process Planning: The Urban Traffic Controller Example'
  authors:
  - Jimoh Falilat Olaitan
  - Simon Parkinson
  - Thomas McCluskey
  venue: Journal of Computer Science
  year: 2017
  month: 8
  volume: '13'
  number: '8'
  pages: 257–274
  publisher: Science Publications
  doi: 10.3844/jcssp.2017.257.274
  abstract: Automated planning and scheduling are increasingly utilised in solving evsery day planning task. Planning in domains with continuous numeric changes present certain limitations and tremendous challenges to advanced planning algorithms. There are many pertinent examples to the engineering community; however, a case study is provided through the urban traffic controller domain. This paper introduce a novel hybrid approach to state-space planning systems involving a continuous process which can be utilised in several applications. We explore Model Predictive Control (MPC) and explain how it can be introduce into planning with domains containing mixed discrete and continuous state variables. This preserves the numerous benefits of AI Planning approach by the use of explicit reasoning and declarative modelling. It also leverages on the capability of MPC to manage numeric computation and control of continuous processes. The hybrid approach was tested on an urban traffic control network
    to ascertain it practicability on a continuous domain; the results show its potential to control and optimise heavy volumes of traffic.
  key: 55b86efe37dd4f81a2e1bbd3dade6dc6
- type: Journal Articles
  title: 'Fog computing security: a review of current applications and security solutions'
  authors:
  - Saad Khan
  - Simon Parkinson
  - Yongrui Qin
  venue: Journal of Cloud Computing
  year: 2017
  month: 8
  volume: '6'
  publisher: Springer Science + Business Media
  doi: 10.1186/s13677-017-0090-3
  abstract: Fog computing is a new paradigm that extends the Cloud platform model by providing computing resources on the edges of a network. It can be described as a cloud-like platform having similar data, computation, storage and application services, but is fundamentally different in that it is decentralized. In addition, Fog systems are capable of processing large amounts of data locally, operate on-premise, are fully portable, and can be installed on heterogeneous hardware. These features make the Fog platform highly suitable for time and location-sensitive applications. For example, Internet of Things (IoT) devices are required to quickly process a large amount of data. This wide range of functionality driven applications intensifies many security issues regarding data, virtualization, segregation, network, malware and monitoring. This paper surveys existing literature on Fog computing applications to identify common security gaps. Similar technologies like Edge computing, Cloudlets
    and Micro-data centres have also been included to provide a holistic review process. The majority of Fog applications are motivated by the desire for functionality and end-user requirements, while the security aspects are often ignored or considered as an afterthought. This paper also determines the impact of those security issues and possible solutions, providing future security-relevant directions to those responsible for designing, developing, and maintaining Fog systems.
  key: cdcb5dc925d942cd961ca1e413b9e905
- type: Journal Articles
  title: Use of Access Control to Minimise Ransomware Impact
  authors:
  - Simon Parkinson
  venue: Network Security
  year: 2017
  month: 7
  volume: '2017'
  number: '7'
  pages: 5–8
  publisher: MA Healthcare Ltd
  doi: 10.1016/S1353-4858(17)30069-7
  key: 8a5cbab13e9c437c855f82c800445e59
- type: Conference Papers
  title: On the Exploitation of Automated Planning for Reducing Machine Tools Energy Consumption Between Manufacturing Operations
  authors:
  - Simon Parkinson
  - Andrew Longstaff
  - Simon Fletcher
  - Mauro Vallati
  - Lukáš Chrpa
  editors:
  - Laura Barbulescu
  - Jeremy Frank
  - Mausam
  - Stephen F. Smith
  venue: 27th International Conference on Automated Planning and Scheduling
  year: 2017
  month: 6
  pages: 400–408
  publisher: Association for the Advancement of Artiﬁcial Intelligence
  doi: 10.1609/icaps.v27i1.13843
  url: http://icaps17.icaps-conference.org/
  abstract: There has recently been an increased emphasis on reducing energy consumption in manufacturing, driven by the fluctuations in energy costs and the growing importance given to environmental impact of manufactured goods. Lots of attention has been given to the reduction of machine tools energy consumption, as they require large amounts of energy to perform manufacturing tasks. One area that has received relatively little interest, yet could harness great potential, is reducing energy consumption by planning machine activities between manufacturing operations, while the machine is not in use. The intuitive option --which is currently exploited in manufacturing-- is to leave the machine in a normal operating state in anticipation of the next manufacturing job. However, this is far from optimal due to the thermal deformation phenomenon, which usually require an energy-intensive warm-up cycle in order to bring all the components (e.g. spindle motor) into a suitable (stable) state for
    actual machining. Evidently, the use of this strategy comes with the associated commercial and environmental repercussions. In this paper, we investigate the exploitability of automated planning techniques for planning machine activities between manufacturing operations. We present a PDDL 2.2 formulation of the task that considers energy consumption, thermal deformation, and accuracy. We then demonstrate the effectiveness of the proposed approach using a case study which considers real-world data.
  key: 32698aaec1e54e4d93278cd1f59d3e6d
- type: Conference Papers
  title: Towards Automated Vulnerability Assessment
  authors:
  - Saad Khan
  - Simon Parkinson
  venue: 11th Scheduling and Planning Applications woRKshop (SPARK), Carnegie Mellon University, Pittsburgh, USA
  year: 2017
  month: 6
- type: Journal Articles
  title: Correlation and convolution filtering and image processing for pitch evaluation of 2D micro- and nano-scale gratings and lattices
  authors:
  - Xiaomei Chen
  - Ludger Koenders
  - Simon Parkinson
  venue: Applied Optics
  year: 2017
  month: 3
  volume: '56'
  number: '9'
  pages: 2434–2443
  publisher: Optica Publishing Group (formerly OSA)
  doi: 10.1364/AO.56.002434
  abstract: We have mathematically explicated and experimentally demonstrated how a correlation and convolution filter can dramatically suppress the noise that coexists with the scanned topographic signals of two-dimensional (2D) gratings and lattices with 2D perspectives. To realize pitch evaluation, the true peaks' coordinates have been precisely acquired after detecting the local maxima from the filtered signal, followed by image processing. The combination of 2D filtering, local-maxima detecting, and image processing make up the pitch detection (PD) method. It is elucidated that the pitch average, uniformity, rotation angle, and orthogonal angle can be calculated using the PD method. This has been applied to the pitch evaluation of several 2D gratings and lattices, and the results are compared with the results of using the center-of-gravity (CG) and Fourier-transform-based (FT) method. The differences of pitch averages which are produced using the PD, CG, and FT methods are within 1.5
    pixels. Moreover, the PD method has also been applied to detect the dense peaks of Si (111) 7 x 7 surface and the highly oriented pyrolytic graphite (HOPG) basal plane.
  key: 8b671c27ea484621b07811bae6d9486c
- type: Conference Papers
  title: Edge Influence Computation in Dynamic Graphs
  authors:
  - Yongrui Qin
  - Quan Z. Sheng
  - Simon Parkinson
  - Nickolas J G Falkner
  editors:
  - Selçuk Candan
  - Lei Chen
  - Torben Bach Pedersen
  - Lijun Chang
  - Wen Hua
  venue: Database Systems for Advanced Applications
  year: 2017
  month: 3
  volume: LNCS 10178
  pages: 649–660
  publisher: Springer, Cham
  doi: 10.1007/978-3-319-55699-4_41
  url: https://link.springer.com/book/10.1007/978-3-319-55753-3
  abstract: Reachability queries are of great importance in many research and application areas, including general graph mining, social network analysis and so on. Many approaches have been proposed to compute whether there exists one path from one node to another node in a graph. Most of these approaches focus on static graphs, however in practice dynamic graphs are more common. In this paper, we focus on handling graph reachability queries in dynamic graphs. Specifically we investigate the influence of a given edge in the graph, aiming to study the overall reachability changes in the graph brought by the possible failure/deletion of the edge. To this end, we firstly develop an efficient update algorithm for handling edge deletions. We then define the edge influence concept and put forward a novel computation algorithm to accelerate the computation of edge influence. We evaluate our approach using several real world datasets. The experimental results show that our approach outperforms traditional
    approaches significantly.
  key: 5551542058714c4b87d5c03f92027a0b
- type: Conference Papers
  title: Towards A Multi-tiered Knowledge-based System for Autonomous Cloud Security Auditing
  authors:
  - Saad Khan
  - Simon Parkinson
  venue: Proceedings of the AAAI-17 Workshop on Artificial Intelligence for Cyber Security (AICS)
  year: 2017
  month: 3
  pages: 187–194
  publisher: Association for the Advancement of Artiﬁcial Intelligence
  url: http://www-personal.umich.edu/~arunesh/AICS2017/index.html
  abstract: 'Every cloud platform has a large number of software components, making it difficult to manage the security of the entire system. This paper discusses the requirement for an intelligent cloud security auditing solution, and an expert system architecture is presented. The solution can identify data confidentiality threats in the OpenStack cloud platform, as well as propose solutions to remove vulnerabilities before an attack occurs. Data confidentiality threats cover a wide range of security risks where attackers usually try to steal/corrupt personal data and are a major concern of users. For this reason, cloud infrastructures need frequent security auditing. The key features of the proposed expert system architecture include: acquisition of information detailing the latest cloud security threats and solutions, the conversion of acquired raw data into usable format, the application of a forward chaining inference algorithm, and the ability for the user to add/modify knowledge,
    which is then utilised to provide feasible solutions in ranked order. These components provide an automated mechanism to generate human-readable audit reports, improving the overall security status without the need for expert knowledge.'
  key: f45da06390564bfb846f00f4f198b6ce
- type: Journal Articles
  title: Improved machine tool linear axis calibration through continuous motion data capture
  authors:
  - J. E. Miller
  - A. P. Longstaff
  - S. Parkinson
  - S. Fletcher
  venue: Precision Engineering
  year: 2017
  month: 1
  volume: '47'
  pages: 249–260
  publisher: Elsevier Inc.
  doi: 10.1016/j.precisioneng.2016.08.010
  abstract: Machine tool calibration is becoming recognised as an important part of the manufacturing process. The current international standards for machine tool linear axes calibration support the use of quasi-static calibration techniques. These techniques can be time consuming but more importantly a compromise in quality due to the practical restriction on the spatial resolution of target positions on the axis under test. Continuous motion calibration techniques have the potential to dramatically increase calibration quality. Through taking several measurement values per second while the axis under test is in motion, it is possible to measure in far greater detail. Furthermore, since machine tools normally operate in dynamic mode, the calibration data can be more representative if it is captured while the machine is in motion. The drawback to measuring the axis while in motion is the potential increase in measurement uncertainty. In the following paper, different methods of continuous
    motion calibration are discussed. A time-based continuous motion solution is proposed as well as a novel optimisation and correlation algorithm to accurately fuse the data taken from quasi-static and continuous motion measurements. The measurement method allows for minimal quasi-static measurements to be taken while using a continuous motion measurement to enhance the calibration process with virtually no additional time constraints. The proposed method does not require any additional machine interfacing, making it a more readily accessible solution for widespread machine tool use than other techniques which require hardware links to the CNC. The result of which means a shorter calibration routine and enhanced results. The quasi-static and continuous motion measurements showed correlation to within 1 μm at the quasi-static measurement targets. An error of 13 μm was detailed on the continuous motion, but was missed using the standard test. On a larger, less accurate machine, the quasi-static
    and continuous motion measurements were on average within 3 μm of each other however, showed a standard deviation of 4 μm which is less than 1% of the overall error. Finally, a high frequency cyclic error was detected in the continuous motion measurement but was missed in the quasi-static measurement.
  key: dda2e3a41cbe4115bca6e6fae0467c7a
- type: Conference Papers
  title: 'Driver Interaction with a Traffic Light Assistant App: A Naturalistic Investigation'
  authors:
  - Kyle Wilson
  - Karl Bridges
  - Paul Ward
  - Simon Parkinson
  - Tyron Louw
  - Ryan Cooney
  editors:
  - Rebecca Charles
  - John Wilkinson
  venue: Contemporary Ergonomics & Human Factors 2017
  year: 2017
  pages: 143–150
  publisher: Chartered Institute of Ergonomics & Human Factors
  url: http://www.ehf2017.org.uk/
  abstract: A smartphone-based traffic light assistant application, EnLighten, was investigated for its ability to improve subjective driving experience and safely reduce the time it took drivers to ‘move off’ at signalised intersections. Five drivers participated in four trials over a period of three weeks. Testing took place on public roads in unaltered normal traffic conditions. It was found that EnLighten can reduce move-off times however it presented safety risks. Advantages and disadvantages of naturalistic in-vehicle testing are also discussed.
  key: 7574440b455e4563a19205c12cc39f72
- type: Conference Papers
  title: Preface
  authors:
  - Lukáš Chrpa
  - Simon Parkinson
  - Mauro Vallati
  venue: Proceedings of the 34th Workshop of the UK Planning and Scheduling Special Interest Group
  year: 2017
  volume: '1782'
  abstract: The PlanSIG workshop is (usually) a yearly forum where academics, industrialists, and research students can meet and discuss current issues in an informal setting. We especially aim to bring together researchers attacking different aspects of planning and scheduling problems, and to introduce new researchers to the community. In recent years the SIG has attracted an international gathering, and we continue to welcome contributions from around the world.
  key: 0d4a103e14184945a8ad13b743c33136
- type: Conference Papers
  title: Security Auditing in the Fog
  authors:
  - Simon Parkinson
  - Yongrui Qin
  - Saad Khan
  - Mauro Vallati
  venue: Proceedings of the Second International Conference on Internet of Things
  year: 2017
  publisher: Association for Computing Machinery (ACM)
  doi: 10.1145/3018896.3056808
  url: http://icc-conference.org/
  abstract: Technology specific expert knowledge is often required to analyse security configurations and determine potential vulnerabilities, but it becomes difficult when it is a new technology such as Fog computing. Furthermore, additional knowledge is also required regarding how the security configuration has been constructed in respect to an organisation's security policies. Traditionally, organisations will often manage their access control permissions relative to their employees needs, posing challenges to administrators. This problem is even exacerbated in Fog computing systems where security configurations are implemented on a large amount of devices at the edges of Internet, and the administrators are required to retain adequate knowledge on how to perform complex administrative tasks. In this paper, a novel approach of translating object-based security configurations in to a graph model is presented. A technique is then developed to autonomously identify vulnerabilities and perform
    security auditing of large systems without the need for expert knowledge. Throughout the paper, access control configuration data is used as a case study, and empirical analysis is performed on synthetically generated access control permissions.
  key: a94bc47d36f64729acdab4ad5b5a3b01
- type: Journal Articles
  title: Identification of irregularities and allocation suggestion of relative file system permissions
  authors:
  - S. Parkinson
  - A. Crampton
  venue: Journal of Information Security and Applications
  year: 2016
  month: 10
  volume: '30'
  pages: 27–39
  publisher: Elsevier Limited
  doi: 10.1016/j.jisa.2016.04.004
  abstract: It is well established that file system permissions in large, multi-user environments can be audited to identify vulnerabilities with respect to what is regarded as standard practice. For example, identifying that a user has an elevated level of access to a system directory which is unnecessary and introduces a vulnerability. Similarly, the allocation of new file system permissions can be assigned following the same standard practices. On the contrary, and less well established, is the identification of potential vulnerabilities as well as the implementation of new permissions with respect to a system's current access control implementation. Such tasks are heavily reliant on expert interpretation. For example, the assigned relationship between users and groups, directories and their parents, and the allocation of permissions on file system resources all need to be carefully considered. This paper presents the novel use of statistical analysis to establish independence and homogeneity
    in allocated file system permissions. This independence can be interpreted as potential anomalies in a system's implementation of access control. The paper then presents the use of instance-based learning to suggest the allocation of new permissions conforming to a system's current implementation structure. Following this, both of the presented techniques are then included in a tool for interacting with Microsoft's New Technology File System (NTFS) permissions. This involves experimental analysis on six different NTFS directory structures within different organisations. The effectiveness of the developed technique is then established through analysing the true positive and true negative values. The presented results demonstrate the potential of the proposed techniques for overcoming complexities with real-world file system administration.
  key: cfccd297a2d64d969135c07435d2eb44
- type: Journal Articles
  title: Auditing file system permissions using association rule mining
  authors:
  - S. Parkinson
  - V. Somaraki
  - R. Ward
  venue: Expert Systems with Applications
  year: 2016
  month: 8
  volume: '55'
  pages: 274–283
  publisher: Elsevier Limited
  doi: 10.1016/j.eswa.2016.02.027
  abstract: Identifying irregular file system permissions in large, multi-user systems is challenging due to the complexity of gaining structural understanding from large volumes of permission information. This challenge is exacerbated when file systems permissions are allocated in an ad-hoc manner when new access rights are required, and when access rights become redundant as users change job roles or terminate employment. These factors make it challenging to identify what can be classed as an irregular file system permission, as well as identifying if they are irregular and exposing a vulnerability. The current way of finding such irregularities is by performing an exhaustive audit of the permission distribution; however, this requires expert knowledge and a significant amount of time. In this paper a novel method of modelling file system permissions which can be used by association rule mining techniques to identify irregular permissions is presented. This results in the creation of object-centric
    model as a by-product. This technique is then implemented and tested on Microsoft's New Technology File System permissions (NTFS). Empirical observations are derived by making comparisons with expert knowledge to determine the effectiveness of the proposed technique on five diverse real-world directory structures extracted from different organisations. The results demonstrate that the technique is able to correctly identify irregularities with an average accuracy rate of 91%, minimising the reliance on expert knowledge. Experiments are also performed on synthetic directory structures which demonstrate an accuracy rate of 95% when the number of irregular permissions constitutes 1% of the total number. This is a significant contribution as it creates the possibility of identifying vulnerabilities without prior knowledge of how to file systems permissions are implemented within a directory structure.
  key: c0ccc2578c1f4e2aa05d54f0adfad946
- type: Conference Papers
  title: 'Planning Machine Activity Between Manufacturing Operations: Maintaining Accuracy While Reducing Energy Consumption'
  authors:
